# Builds the native voice client (clients/voice: the Tauri desktop app and the CLI) for Linux and
# Windows, tests it, and collects the release files.
#
# Triggers: a tag `client-v<semver>` (the build that becomes a draft GitHub Release) or a manual run
# (`workflow_dispatch`). Never on push or pull request: the build is heavy (libwebrtc).
#
# How it builds (technique borrowed from the owner's other Tauri project):
#   * ONE Linux job builds everything inside the image from `clients/voice/Dockerfile.dev`
#     (`--target windows`): the Linux binaries natively, the Windows binaries cross-compiled for
#     x86_64-pc-windows-msvc with cargo-xwin (clang-cl + lld-link, Windows SDK from Microsoft).
#     No Windows runner is needed to BUILD.
#   * A real Windows runner (`windows-smoke`) then RUNS what was cross-built: the unit tests
#     (compiled as .exe on Linux, so the named-pipe push-to-talk code is exercised for real) and a
#     smoke test that starts the app, checks its window and drives the push-to-talk pipe.
#   * `package` signs the Windows files when asked to, zips, writes SHA256SUMS and the manifest.
#   * `draft-release` (tags only) attaches everything to a DRAFT release. The owner publishes it.
#
# Version contract (reconciled with scripts/ops/build-client.sh and the download page):
#   app_version = the tag without `client-v`, or the `version` input, or (neither) the workspace
#   version in clients/voice/Cargo.toml. It is written into the workspace version and
#   tauri.conf.json before building, so `lanomat-voice --version` and the app report it.
#   LANOMAT_BUILD_VERSION and LANOMAT_BUILD_COMMIT are exported to every build step for tooling
#   that wants them (build-client.sh uses the same two names); the commit is the full SHA.
#
# Release files (names are part of the contract, see docs/infra/native-client-release.md):
#   lanomat-voice-linux-x86_64.tar.gz        CLI            (kind cli, os linux)
#   lanomat-voice-app-linux-x86_64.tar.gz    desktop app    (kind app, os linux)
#   lanomat-voice-windows-x86_64.exe         CLI            (kind cli, os windows)
#   lanomat-voice-app-windows-x86_64.zip     desktop app, portable (kind app, os windows)
#   SHA256SUMS, manifest-linux-x86_64.json, manifest-windows-x86_64.json
#   Every manifest entry: { name, os, arch, kind, size, sha256, signed }.
#
# Windows code signing (OFF by default, files are labelled `signed: false`):
#   set the repository VARIABLE  WINDOWS_SIGNING=signpath  and provide
#     secret    SIGNPATH_API_TOKEN
#     variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG,
#               SIGNPATH_ARTIFACT_CONFIGURATION_SLUG (optional)
#   See the `sign-windows-signpath` step in the `package` job and docs/infra/native-client-release.md.
#
# Runner choice: repository variables CLIENT_LINUX_RUNS_ON / CLIENT_WINDOWS_RUNS_ON (JSON string,
# e.g. '"ubuntu-24.04"') override the defaults.
name: Release native client

on:
  push:
    tags: ['client-v*']
  # TEMPORARY (testing only, removed before the PR is finished): lets the workflow run from the PR.
  pull_request:
    paths:
      - 'clients/voice/**'
      - '.github/workflows/release-client.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (x.y.z); empty = the version in clients/voice/Cargo.toml'
        required: false
        default: ''
      publish:
        description: 'Create the DRAFT GitHub Release (only honoured when run on a client-v* tag)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ${{ fromJSON(vars.CLIENT_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide version and release mode
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#client-v}
          elif [ -n "$INPUT_VERSION" ]; then
            version=$INPUT_VERSION
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' clients/voice/Cargo.toml | head -n1)
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semver version (tag scheme: client-v<major>.<minor>.<patch>)"
            exit 1
          fi
          release=false
          if [ "$GITHUB_REF_TYPE" = tag ] && { [ "$GITHUB_EVENT_NAME" = push ] || [ "$INPUT_PUBLISH" = true ]; }; then
            release=true
          fi
          {
            echo "version=$version"
            echo "commit=$GITHUB_SHA"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::client $version at ${GITHUB_SHA::12}, draft release: $release"

  # Linux build and test, and the Windows cross-build, all inside the Dockerfile.dev image.
  build:
    needs: meta
    runs-on: ${{ fromJSON(vars.CLIENT_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    env:
      LANOMAT_BUILD_VERSION: ${{ needs.meta.outputs.version }}
      LANOMAT_BUILD_COMMIT: ${{ needs.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the toolchain image (clang 21, Tauri deps, cargo-xwin)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: clients/voice
          file: clients/voice/Dockerfile.dev
          target: windows
          load: true
          tags: lanomat-voice-build:ci
          cache-from: type=gha,scope=client-image
          cache-to: type=gha,scope=client-image,mode=max

      # The cargo registry, the target directory (libwebrtc is downloaded and compiled into it) and the
      # Windows SDK that cargo-xwin fetches (about 1.5 GB from Microsoft) are cached between runs.
      - name: Cache cargo, target and xwin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci-cache/registry
            .ci-cache/target
            .ci-cache/xwin
          key: client-build-${{ hashFiles('clients/voice/Cargo.lock') }}
          restore-keys: client-build-

      - name: Set the version
        run: |
          set -euo pipefail
          cd clients/voice
          sed -i -E '0,/^version = ".*"/s//version = "'"$LANOMAT_BUILD_VERSION"'"/' Cargo.toml
          sed -i -E '0,/"version": ".*"/s//"version": "'"$LANOMAT_BUILD_VERSION"'"/' app/tauri.conf.json
          grep -n '^version' Cargo.toml
          grep -n '"version"' app/tauri.conf.json

      - name: Run the build script in the image
        run: |
          set -euo pipefail
          mkdir -p .ci-cache/registry .ci-cache/target .ci-cache/xwin clients/voice/dist
          docker run --rm \
            -e LANOMAT_BUILD_VERSION -e LANOMAT_BUILD_COMMIT \
            -v "$PWD/clients/voice:/work" \
            -v "$PWD/.ci-cache/registry:/usr/local/cargo/registry" \
            -v "$PWD/.ci-cache/target:/work/target" \
            -v "$PWD/.ci-cache/xwin:/xwin-cache" \
            lanomat-voice-build:ci sh ci/build.sh

      - name: Stage files for the next jobs
        run: |
          set -euo pipefail
          sudo chown -R "$USER" clients/voice/dist
          mkdir -p stage/linux stage/windows stage/windows-tests
          cp clients/voice/dist/linux/* stage/linux/
          cp clients/voice/dist/windows/*.exe stage/windows/
          cp clients/voice/dist/windows-tests/* stage/windows-tests/
          ls -l stage/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-linux
          path: stage/linux/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-windows-unsigned
          path: stage/windows/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-windows-tests
          path: stage/windows-tests/
          if-no-files-found: error
          retention-days: 7

  # Runs the cross-built Windows binaries on a real Windows system.
  windows-smoke:
    needs: [meta, build]
    runs-on: ${{ fromJSON(vars.CLIENT_WINDOWS_RUNS_ON || '"windows-2025"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-windows-unsigned
          path: bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-windows-tests
          path: tests
      - name: Unit tests (compiled on Linux, run here)
        shell: pwsh
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem tests -Filter *.exe) {
            Write-Host "::group::$($t.Name)"
            & $t.FullName --test-threads=4
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
            Write-Host '::endgroup::'
          }
          if ($failed.Count -gt 0) { throw "failing test binaries: $($failed -join ', ')" }
      - name: Smoke test (CLI version, app window, push-to-talk pipe)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: ./clients/voice/ci/windows-smoke.ps1 -Dir bin -Version $env:APP_VERSION

  # Zips, optionally signs, writes SHA256SUMS and the manifests.
  package:
    needs: [meta, build, windows-smoke]
    runs-on: ${{ fromJSON(vars.CLIENT_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      COMMIT: ${{ needs.meta.outputs.commit }}
      SIGNING: ${{ vars.WINDOWS_SIGNING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-linux
          path: linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-windows-unsigned
          path: windows-unsigned

      # ---- Windows signing hook: OFF unless the repository variable WINDOWS_SIGNING is `signpath`. ----
      # SignPath Foundation (free for open source) signs the .exe files; the submit action needs the
      # GitHub artifact id of the unsigned upload, hence the extra upload step in front of it.
      - name: Upload the unsigned Windows files for SignPath
        id: upload-unsigned
        if: ${{ vars.WINDOWS_SIGNING == 'signpath' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-to-sign
          path: windows-unsigned/*.exe
          if-no-files-found: error
          retention-days: 1
      - name: sign-windows-signpath
        if: ${{ vars.WINDOWS_SIGNING == 'signpath' }}
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: windows-signed
      # Alternative: Azure Artifact Signing (formerly Trusted Signing). Needs an Azure identity
      # (OIDC, `id-token: write` on this job) and an Artifact Signing account, certificate profile:
      #   - uses: azure/login@<pinned sha>
      #     with: { client-id: ${{ vars.AZURE_CLIENT_ID }}, tenant-id: ${{ vars.AZURE_TENANT_ID }}, subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }} }
      #   - uses: azure/artifact-signing-action@<pinned sha>      # runs on a windows runner
      #     with: { endpoint: ..., signing-account-name: ..., certificate-profile-name: ..., files-folder: windows-unsigned, files-folder-filter: exe }
      # (that route has to run on a Windows runner: move this signing step into its own job.)

      - name: Assemble the release files
        run: |
          set -euo pipefail
          mkdir -p out/linux out/windows
          signed=false
          src=windows-unsigned
          if [ "$SIGNING" = signpath ]; then
            signed=true
            src=windows-signed
          fi
          echo "signed=$signed" >> "$GITHUB_ENV"

          # Linux: tarballs keep the executable bit.
          cp linux/* out/linux/

          # Windows: the CLI as a plain .exe, the app as a portable zip (exe plus a short note).
          cp "$src/lanomat-voice.exe" out/windows/lanomat-voice-windows-x86_64.exe
          mkdir -p zip/LANoMAT-Voice
          cp "$src/lanomat-voice-app.exe" zip/LANoMAT-Voice/LANoMAT-Voice.exe
          cat > zip/LANoMAT-Voice/LIES-MICH.txt <<EOF
          LANoMAT Voice $VERSION (portable, Windows 10/11 x64)

          Starten: LANoMAT-Voice.exe. Voraussetzung ist die WebView2-Laufzeit (ab Windows 11 und
          in aktuellen Windows-10-Installationen vorhanden).
          Unsigniert: SmartScreen warnt. "Weitere Informationen", dann "Trotzdem ausfuehren".
          EOF
          (cd zip && zip -r "../out/windows/lanomat-voice-app-windows-x86_64.zip" LANoMAT-Voice)

      - name: Checksums and manifests
        run: |
          set -euo pipefail
          chmod +x clients/voice/ci/manifest.sh
          clients/voice/ci/manifest.sh out/linux linux x86_64 "$VERSION" "$COMMIT" false
          clients/voice/ci/manifest.sh out/windows windows x86_64 "$VERSION" "$COMMIT" "$signed"
          mkdir -p dist
          cp out/linux/* out/windows/* dist/
          (cd dist && ls -l && sha256sum -- lanomat-voice-* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-release-files
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # Tags only: a DRAFT release with the files. The owner reviews and publishes it.
  draft-release:
    needs: [meta, package]
    if: ${{ needs.meta.outputs.release == 'true' }}
    runs-on: ${{ fromJSON(vars.CLIENT_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.meta.outputs.version }}
      SIGNING: ${{ vars.WINDOWS_SIGNING }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-release-files
          path: dist
      - name: Create the draft release
        run: |
          set -euo pipefail
          if [ "$SIGNING" = signpath ]; then
            note='Die Windows-Dateien sind signiert.'
          else
            note='Die Windows-Dateien sind UNSIGNIERT: SmartScreen kann warnen ("Weitere Informationen", dann "Trotzdem ausfuehren").'
          fi
          cat > notes.md <<EOF
          LANoMAT Voice $VERSION (native client).

          - Windows 10/11 x64: \`lanomat-voice-app-windows-x86_64.zip\` entpacken und \`LANoMAT-Voice.exe\` starten (WebView2 noetig); \`lanomat-voice-windows-x86_64.exe\` ist die Kommandozeile.
          - Linux x86_64: \`lanomat-voice-app-linux-x86_64.tar.gz\` bzw. \`lanomat-voice-linux-x86_64.tar.gz\` entpacken.

          $note
          Pruefsummen: \`SHA256SUMS\` und die \`manifest-*.json\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "LANoMAT Voice $VERSION" \
            --notes-file notes.md
