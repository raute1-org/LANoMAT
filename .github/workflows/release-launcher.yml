# Builds the LANoMAT Launcher (clients/launcher) for Linux, Windows and macOS and uploads the
# opaque-ready files as workflow artifacts. Nothing is published: the operator copies the
# `launcher-release` artifact (tarball, exe, .dmg, zipped .app, manifest.json, SHA256SUMS) into
# `clients-dist/launcher/` on the server, which is what `/launcher` and Preflight's `launcher_build`
# check read. The `package` job is what makes that folder complete: a manifest that lists every OS.
#
# Triggers: a tag `launcher-v*` or a manual run. Never on push: the Tauri build is heavy.
# The version is the server's own (`scripts/ops/lib/version.sh`, same as
# scripts/ops/build-launcher.sh) unless the `version` input overrides it.
#
# A `launcher-v*` tag is a TRIGGER ONLY: `git describe` would return the tag (e.g. `launcher-v1.2`),
# so a leading `launcher-v` is stripped and the version falls back to the commit's own describe
# string. The tag never becomes the app version — that would label the download, the manifest and
# the launcher's update check with a string the server does not report.
#
# Linux is built and tested in the `app` stage of Dockerfile.dev via clients/launcher/ci/build.sh
# (fmt, clippy, `cargo test --workspace`, release build); Windows is cross-compiled with cargo-xwin in
# the `windows` stage of the same pinned image (no Windows runner needed). macOS is the exception: a
# `.app`/`.dmg` needs Apple's `hdiutil`, `codesign` and a real macOS host, so the `macos` job runs on
# GitHub's macOS runners. Its arm64 leg (macos-15) is required; the Intel leg is best-effort, because
# the arm64 build is the one every current Mac can run (and the runner labels get retired).
# The artifacts are only offered by /launcher after an operator copies the `launcher-release` artifact
# into clients-dist/launcher/ — it carries the Linux tarball, the Windows exe, the macOS `.dmg` and
# zipped `.app` of the same version and one manifest listing all of them. Rebuilding that folder from a
# checkout must happen on a clean tree (scripts/ops/build-launcher.sh refuses otherwise).
name: Release launcher

on:
  push:
    tags: ['launcher-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string; empty = the one this commit reports (git describe)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-launcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version string comes from the tags
      - name: Decide version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source scripts/ops/lib/version.sh
          version=${INPUT_VERSION:-$(lanomat_version .)}
          # `launcher-v*` tags only start this run, they do not name the build: strip the prefix so
          # the version stays the commit's own describe string (scripts/ops/lib/version.sh stays the
          # one source of what "the LANoMAT version" is).
          case "$version" in
            launcher-v*) version=${version#launcher-v} ;;
          esac
          if ! lanomat_version_ok "$version"; then
            echo "::error::'$version' is not a usable version string (letters, digits, . _ - ; at most 64)"
            exit 1
          fi
          commit=$(lanomat_commit .)
          {
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::launcher $version at $commit"

  linux:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      COMMIT: ${{ needs.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the Linux toolchain image (Tauri deps)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: clients/launcher
          file: clients/launcher/Dockerfile.dev
          target: app
          load: true
          tags: lanomat-launcher-dev:ci
          cache-from: type=gha,scope=launcher-image
          cache-to: type=gha,scope=launcher-image,mode=max

      - name: Cache the cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci-cache/registry
            .ci-cache/target
          key: launcher-build-${{ hashFiles('clients/launcher/Cargo.lock') }}
          restore-keys: launcher-build-

      - name: Format, lint, test and build in the image
        run: |
          set -euo pipefail
          mkdir -p .ci-cache/registry .ci-cache/target clients/launcher/dist
          docker run --rm \
            -e LANOMAT_BUILD_VERSION="$VERSION" \
            -e LANOMAT_BUILD_COMMIT="$COMMIT" \
            -e LANOMAT_LAUNCHER_COMMIT="$COMMIT" \
            -v "$PWD/clients/launcher:/work" \
            -v "$PWD/.ci-cache/registry:/usr/local/cargo/registry" \
            -v "$PWD/.ci-cache/target:/work/target" \
            lanomat-launcher-dev:ci sh ci/build.sh

      - name: Write the manifest and checksums
        run: |
          set -euo pipefail
          sudo chown -R "$USER" clients/launcher/dist
          mkdir -p clients-dist/launcher
          cp clients/launcher/dist/linux/*.tar.gz clients-dist/launcher/
          archive="lanomat-launcher-${VERSION}-linux-x86_64.tar.gz"
          test -f "clients-dist/launcher/$archive"
          cd clients-dist/launcher
          size=$(stat -c %s "$archive")
          sha=$(sha256sum "$archive" | cut -d' ' -f1)
          cat > manifest.json <<JSON
          {
            "app_version": "$VERSION",
            "commit": "$COMMIT",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "files": [
              {
                "name": "$archive",
                "os": "linux",
                "arch": "x86_64",
                "kind": "app",
                "variant": "archive",
                "size": $size,
                "sha256": "$sha",
                "signed": false
              }
            ]
          }
          JSON
          sha256sum -- "$archive" > SHA256SUMS
          cat manifest.json SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-linux
          path: clients-dist/launcher/
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      COMMIT: ${{ needs.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the Windows toolchain image (cargo-xwin, LLVM)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: clients/launcher
          file: clients/launcher/Dockerfile.dev
          target: windows
          load: true
          tags: lanomat-launcher-win:ci
          cache-from: type=gha,scope=launcher-windows-image
          cache-to: type=gha,scope=launcher-windows-image,mode=max

      - name: Cache the cargo registry, target and Windows SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci-cache/registry
            .ci-cache/target
            .ci-cache/xwin
          key: launcher-windows-${{ hashFiles('clients/launcher/Cargo.lock') }}
          restore-keys: launcher-windows-

      - name: Cross-build the portable exe
        run: |
          set -euo pipefail
          mkdir -p .ci-cache/registry .ci-cache/target .ci-cache/xwin
          docker run --rm \
            -e LANOMAT_BUILD_COMMIT="$COMMIT" \
            -e LANOMAT_LAUNCHER_COMMIT="$COMMIT" \
            -v "$PWD/clients/launcher:/work" \
            -v "$PWD/.ci-cache/registry:/usr/local/cargo/registry" \
            -v "$PWD/.ci-cache/target:/work/target" \
            -v "$PWD/.ci-cache/xwin:/xwin-cache" \
            -w /work lanomat-launcher-win:ci \
            cargo xwin build --locked --release --target x86_64-pc-windows-msvc -p lanomat-launcher-app

      - name: Stage the portable exe
        run: |
          set -euo pipefail
          sudo chown -R "$USER" .ci-cache/target
          src=".ci-cache/target/x86_64-pc-windows-msvc/release/lanomat-launcher.exe"
          test -s "$src"
          # PE sanity check before an unsigned binary is offered for download: "MZ" at offset 0,
          # then the Machine field of the PE header (e_lfanew at 60, signature at e_lfanew,
          # machine right after it) must be 0x8664 = x86-64. A cross-build that silently produced
          # a different target must not reach /launcher.
          test "$(head -c 2 "$src")" = "MZ" || { echo "::error::$src has no MZ header"; exit 1; }
          pe_offset="$(od -An -tu4 -j 60 -N4 "$src" | tr -d ' \n')"
          test -n "$pe_offset" || { echo "::error::$src has no PE header offset"; exit 1; }
          pe_machine="$(od -An -tx1 -j "$((pe_offset + 4))" -N2 "$src" | tr -d ' \n')"
          test "$pe_machine" = "6486" || {
            echo "::error::$src is not an x86-64 PE (machine 0x$pe_machine, expected 0x8664)"
            exit 1
          }
          echo "PE ok: $src ($(stat -c %s "$src") bytes)"
          mkdir -p clients-dist/launcher
          name="lanomat-launcher-${VERSION}-windows-x86_64-portable.exe"
          install -m 0644 "$src" "clients-dist/launcher/$name"
          # The arcade/gaming-terminal installer and the URL-scheme installer travel with the exe:
          # install-terminal.ps1 registers lanomat:// through its sibling install-desktop.ps1, so the
          # two must stay next to each other (and next to the exe).
          install -m 0644 clients/launcher/scripts/install-desktop.ps1 clients-dist/launcher/install-desktop.ps1
          install -m 0644 clients/launcher/scripts/install-terminal.ps1 clients-dist/launcher/install-terminal.ps1
          cd clients-dist/launcher
          sha256sum -- "$name" > SHA256SUMS.windows
          cat SHA256SUMS.windows
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-windows
          path: clients-dist/launcher/
          if-no-files-found: error
          retention-days: 7

  # macOS cannot be cross-built from Linux: `.app`/`.dmg` need Apple's toolchain (codesign,
  # hdiutil) and a macOS host. The `.dmg` and the zipped `.app` are both produced so /launcher can
  # offer the drag-to-Applications image and keep a plain archive as fallback.
  #
  # The arm64 leg (macos-15) is required: every current Mac runs it. The Intel leg (macos-15-intel)
  # is best-effort — a retired runner label or a failed Intel build must not lose the arm64 release,
  # so its failure is neutralised (`continue-on-error`). `package` merges whichever legs uploaded.
  macos:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
            experimental: false
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
            experimental: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      COMMIT: ${{ needs.meta.outputs.commit }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      # Code signing and notarization stay off until the Apple Developer ID secrets exist. Tauri
      # picks them up automatically when set; empty values keep the build unsigned (`signed: false`).
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the Tauri CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-v2-${{ matrix.arch }}

      - name: Install the Rust target and the Tauri CLI
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          command -v cargo-tauri >/dev/null 2>&1 \
            || cargo install tauri-cli --version "^2" --locked

      - name: Cache the cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            clients/launcher/target
          key: launcher-macos-${{ matrix.arch }}-${{ hashFiles('clients/launcher/Cargo.lock') }}
          restore-keys: launcher-macos-${{ matrix.arch }}-

      - name: Build the .app and .dmg
        working-directory: clients/launcher/app
        env:
          LANOMAT_LAUNCHER_COMMIT: ${{ needs.meta.outputs.commit }}
          CI: true
        run: |
          set -euo pipefail
          # Empty GitHub secrets still arrive as empty env vars; Tauri treats
          # their presence as "sign me" and tries to import an empty .p12.
          # Unset them so an unsigned build stays unsigned (and the same
          # workflow signs automatically once real Developer-ID secrets exist).
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                     APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then unset "$var"; fi
          done
          # bundle.active=true plus per-OS `--bundles`: macOS builds exactly the app and the dmg;
          # Windows keeps its NSIS/portable path (`cargo tauri build --bundles nsis`).
          cargo tauri build --target "$TARGET" --bundles app,dmg --ci

      - name: Stage the bundles and the manifest entries
        run: |
          set -euo pipefail
          bundle="clients/launcher/target/$TARGET/release/bundle"
          app="$bundle/macos/LANoMAT Launcher.app"
          dmg="$(ls -1 "$bundle"/dmg/*.dmg 2>/dev/null | head -n 1 || true)"
          test -d "$app" || { echo "::error::missing $app"; exit 1; }
          test -n "$dmg" || { echo "::error::$bundle/dmg holds no .dmg"; exit 1; }
          hdiutil imageinfo "$dmg" >/dev/null || { echo "::error::$dmg is not a disk image"; exit 1; }

          # Mach-O sanity check: the bundle must carry the executable of the matrix arch, so an
          # accidentally native build cannot be published under the other arch's name.
          main="$app/Contents/MacOS/lanomat-launcher"
          test -x "$main" || { echo "::error::missing $main"; exit 1; }
          info="$(file -b "$main")"
          case "$ARCH" in
            aarch64) echo "$info" | grep -q 'arm64' || { echo "::error::$main is not arm64: $info"; exit 1; } ;;
            x86_64) echo "$info" | grep -q 'x86_64' || { echo "::error::$main is not x86_64: $info"; exit 1; } ;;
            *) echo "::error::unsupported arch $ARCH"; exit 1 ;;
          esac

          mkdir -p clients-dist/launcher
          dmg_name="lanomat-launcher-${VERSION}-macos-${ARCH}.dmg"
          app_name="lanomat-launcher-${VERSION}-macos-${ARCH}.zip"
          cp "$dmg" "clients-dist/launcher/$dmg_name"
          ditto -c -k --sequesterRsrc --keepParent "$app" "clients-dist/launcher/$app_name"

          # Unsigned until the Apple secrets exist: only claim `signed: true` when codesign really
          # verifies the bundle (an ad-hoc signature also passes, which is the honest answer).
          signed=false
          if codesign --verify --deep --strict "$app" >/dev/null 2>&1; then
            signed=true
          fi

          cd clients-dist/launcher
          dmg_size="$(stat -f %z "$dmg_name")"
          dmg_sha="$(shasum -a 256 "$dmg_name" | cut -d' ' -f1)"
          app_size="$(stat -f %z "$app_name")"
          app_sha="$(shasum -a 256 "$app_name" | cut -d' ' -f1)"
          # variant stays `archive`: the server's LauncherBuilds accepts installer|portable|archive
          # and reserves installer/portable for Windows. `format` names the actual payload.
          jq -n --arg arch "$ARCH" --argjson signed "$signed" \
            --arg dmg "$dmg_name" --argjson dmg_size "$dmg_size" --arg dmg_sha "$dmg_sha" \
            --arg app "$app_name" --argjson app_size "$app_size" --arg app_sha "$app_sha" \
            '[{name: $dmg, os: "macos", arch: $arch, kind: "app", variant: "archive",
               format: "dmg", size: $dmg_size, sha256: $dmg_sha, signed: $signed},
              {name: $app, os: "macos", arch: $arch, kind: "app", variant: "archive",
               format: "app", size: $app_size, sha256: $app_sha, signed: $signed}]' \
            > "entries-macos-$ARCH.json"
          shasum -a 256 "$dmg_name" "$app_name" > "SHA256SUMS.macos-$ARCH"
          cat "entries-macos-$ARCH.json" "SHA256SUMS.macos-$ARCH"
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-macos-${{ matrix.arch }}
          path: clients-dist/launcher/
          if-no-files-found: error
          retention-days: 7

  # Every per-OS job builds and uploads on its own runner, so none sees the other's files. This
  # job is the one publishable folder: Linux tarball + manifest from `launcher-linux`, the exe from
  # `launcher-windows`, the `.dmg`/`.zip` from `launcher-macos-*`, and a manifest that lists
  # ALL of them. Without it /launcher would offer only the OSes that happened to be downloaded
  # (the page renders exactly the manifest's entries).
  package:
    needs: [meta, linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: launcher-linux
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: launcher-windows
          path: release

      # The arm64 leg always exists; the Intel leg only when its runner was available. Both have
      # distinct file names, so merging the artifacts into one directory is safe.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: launcher-macos-*
          path: release
          merge-multiple: true

      - name: Merge the Windows and macOS entries into the manifest
        run: |
          set -euo pipefail
          cd release
          archive="lanomat-launcher-${VERSION}-linux-x86_64.tar.gz"
          exe="lanomat-launcher-${VERSION}-windows-x86_64-portable.exe"
          test -f "$archive" || { echo "::error::missing $archive from the linux job"; exit 1; }
          test -f "$exe" || { echo "::error::missing $exe from the windows job"; exit 1; }
          # The Windows installers ride along unversioned; they are not manifest entries (the page
          # offers builds, not helper scripts), so only their presence is checked here.
          test -f install-desktop.ps1 || { echo "::error::missing install-desktop.ps1 from the windows job"; exit 1; }
          test -f install-terminal.ps1 || { echo "::error::missing install-terminal.ps1 from the windows job"; exit 1; }
          test "$(jq -r '.app_version' manifest.json)" = "$VERSION" || {
            echo "::error::the linux manifest names another version than $VERSION"
            exit 1
          }

          # Same entry shape and key order as scripts/ops/build-launcher.sh writes: replace an entry
          # of the same name, keep app_version/commit/built_at from the Linux job.
          size="$(stat -c %s "$exe")"
          sha="$(sha256sum -- "$exe" | cut -d' ' -f1)"
          jq --arg name "$exe" --argjson size "$size" --arg sha "$sha" '
            .files = ((.files | map(select(.name != $name))) + [{
              name: $name, os: "windows", arch: "x86_64", kind: "app",
              variant: "portable", format: "exe", size: $size, sha256: $sha, signed: false
            }])
          ' manifest.json > manifest.next
          mv manifest.next manifest.json

          # One entries-macos-<arch>.json per macOS leg. A missing arm64 leg means the macos job
          # uploaded nothing and the release would silently lose macOS.
          shopt -s nullglob
          mac_entries=(entries-macos-*.json)
          if [ ${#mac_entries[@]} -eq 0 ]; then
            echo "::error::no entries-macos-*.json from the macos job"
            exit 1
          fi
          jq -s 'add' "${mac_entries[@]}" > macos-entries.json
          if ! jq -e 'length > 0 and all(.[]; .os == "macos" and .kind == "app" and .variant == "archive" and (.arch == "aarch64" or .arch == "x86_64") and (.format == "dmg" or .format == "app"))' macos-entries.json >/dev/null; then
            echo "::error::the macOS entries are malformed"
            cat macos-entries.json
            exit 1
          fi
          # The files the entries claim must be in this folder, byte for byte.
          while IFS=$'\t' read -r name expected_size expected_sha; do
            test -f "$name" || { echo "::error::missing $name from the macos job"; exit 1; }
            test "$(stat -c %s "$name")" = "$expected_size" || { echo "::error::size mismatch for $name"; exit 1; }
            test "$(sha256sum -- "$name" | cut -d' ' -f1)" = "$expected_sha" || { echo "::error::sha256 mismatch for $name"; exit 1; }
          done < <(jq -r '.[] | [.name, .size, .sha256] | @tsv' macos-entries.json)

          jq --slurpfile macos macos-entries.json '
            .files = ((.files | map(select(.os != "macos"))) + $macos[0])
          ' manifest.json > manifest.next
          mv manifest.next manifest.json

          # SHA256SUMS from exactly the manifest's files (the Linux job's line is regenerated with
          # the other lines added; the page and Preflight compare both).
          : > SHA256SUMS
          jq -r '.files[].name' manifest.json | while IFS= read -r name; do
            sha256sum -- "$name" >> SHA256SUMS
          done
          sha256sum --check --quiet SHA256SUMS
          rm -f SHA256SUMS.windows SHA256SUMS.macos-* entries-macos-*.json macos-entries.json

          # Exactly one app build per OS, macOS at least arm64 (Intel may be missing when its
          # runner label was retired). The old assertion only allowed linux/windows.
          jq -e '.files | map(.os) | unique | sort == ["linux", "macos", "windows"]' manifest.json >/dev/null \
            || { echo "::error::the manifest does not list one file per OS (linux, macos, windows)"; exit 1; }
          mac_arches="$(jq -r '[.files[] | select(.os == "macos") | .arch] | unique | sort | join(",")' manifest.json)"
          case "$mac_arches" in
            aarch64|x86_64|aarch64,x86_64) ;;
            *) echo "::error::macOS entries carry unexpected arches: $mac_arches"; exit 1 ;;
          esac
          jq -e '[.files[] | select(.os == "macos") | .format] | unique | sort == ["app", "dmg"]' manifest.json >/dev/null \
            || { echo "::error::macOS entries must offer both the dmg and the app archive"; exit 1; }
          cat manifest.json SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-release
          path: release/
          if-no-files-found: error
          retention-days: 7
