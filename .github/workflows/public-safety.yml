# Public-repository safety net for non-secret data. This repository is PUBLIC,
# so nothing sensitive (internal IPs, personal e-mails, SSH keys, Discord IDs)
# may ever land in it. See CONTRIBUTING.md, "Public repository rules".
#
# Secret scanning (gitleaks, full history) lives in its own workflow:
# .github/workflows/gitleaks.yml.
#
# Deliberately a SEPARATE workflow from ci.yml: ci.yml skips docs-only changes
# (paths-ignore for **.md / docs/**), but docs-only PRs are exactly where
# leaks happen. This workflow has NO paths filter and runs on every pull
# request and every push to main.
#
# Not part of the aggregate `ci` job (a job in another workflow cannot be a
# `needs` target); mark the `public-safety` check as required in branch
# protection next to `ci` and `gitleaks`.
name: public-safety
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: public-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  public-safety:
    name: public-safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Self-test first: a regex change that breaks the scanner must not make
      # the real scan silently pass.
      - name: Public-safety check self-test
        run: scripts/ops/check-public-safe.sh --self-test

      - name: Public-safety check (IPs, e-mails, keys, Discord IDs)
        run: scripts/ops/check-public-safe.sh
