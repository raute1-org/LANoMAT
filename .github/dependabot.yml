version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/docker/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      composer:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/docker/discord-gateway"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      npm:
        patterns:
          - "*"
    # Held back until the tooling catches up (checked on PR #148): eslint-plugin-import has no eslint 10
    # support yet (npm ci fails with ERESOLVE), and typescript-eslint and vue-tsc do not support TypeScript 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
