version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/docker/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      composer:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/docker/discord-gateway"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      npm:
        patterns:
          - "*"
