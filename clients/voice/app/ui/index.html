<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>LANoMAT</title>
        <link rel="stylesheet" href="app.css" />
        <link rel="stylesheet" href="screens.css" />
    </head>
    <body>
        <div class="app">
            <header class="bar" id="bar">
                <div class="brand">
                    <span class="logo" id="logo" aria-hidden="true"></span>
                    <span id="brand-name"></span>
                    <span class="event" id="event-name" hidden></span>
                </div>
                <div class="spacer"></div>
                <button
                    class="quiet-toggle"
                    id="quiet"
                    type="button"
                    aria-pressed="false"
                    hidden
                ></button>
                <div class="who" id="who" hidden>
                    <span class="dot" id="who-dot" aria-hidden="true"></span>
                    <span id="who-text"></span>
                </div>
            </header>
            <div class="banner" id="offline-banner" role="status" hidden></div>
            <div
                class="update-banner"
                id="update-banner"
                role="status"
                hidden
            ></div>
            <nav class="tabs" id="tabs" hidden></nav>

            <main id="main" tabindex="-1">
                <section
                    class="page"
                    id="screen-boot"
                    aria-busy="true"
                ></section>
                <section
                    class="page narrow"
                    id="screen-connect"
                    hidden
                ></section>
                <section
                    class="page narrow"
                    id="screen-onboarding"
                    hidden
                ></section>
                <section class="page" id="screen-jetzt" hidden></section>
                <section class="page" id="screen-sprache" hidden></section>
                <section class="page" id="screen-spielen" hidden></section>
                <section class="page" id="screen-essen" hidden></section>
                <section class="page" id="screen-mehr" hidden></section>
            </main>

            <div class="dock" id="dock" hidden></div>
        </div>
        <div class="toast" id="toast" role="status" hidden></div>
        <div class="sr-only" id="live" aria-live="polite"></div>
        <dialog class="sheet" id="help" aria-labelledby="help-title"></dialog>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
