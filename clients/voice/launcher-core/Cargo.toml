[package]
name = "launcher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Auth, install plan, download and archive engine for the LANoMAT launcher"

[features]
# In-memory Registry/FileSystem doubles for the app crate's tests.
test-doubles = []

[dependencies]
bzip2 = "0.6"
directories = "6"
libmkiso = { version = "0.1.5", default-features = false }
reqwest = { version = "0.13", features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
url = "2"
zip = { version = "6", default-features = false, features = ["deflate", "bzip2", "time"] }

[dev-dependencies]
libmkiso = { version = "0.1.5", features = ["native-writer"] }
tempfile = "3"
wiremock = "0.6"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.100"
