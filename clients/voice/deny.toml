# SPIKE (all-in-one client, phase 0): license policy for the merged workspace. Run in the Docker
# image: `cargo install cargo-deny --locked && cargo deny check licenses` (see the workspace spike
# report). Not wired into CI yet.
[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "bzip2-1.0.6",
    "BSL-1.0",
]
