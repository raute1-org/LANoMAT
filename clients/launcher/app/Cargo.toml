[package]
name = "lanomat-launcher-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LANoMAT Launcher (Tauri v2) for one-click game installs"

[lib]
name = "lanomat_launcher_app"
path = "src/lib.rs"

[[bin]]
name = "lanomat-launcher"
path = "src/main.rs"

[dependencies]
launcher-core = { path = "../launcher-core" }
reqwest = { version = "0.13", features = ["rustls"] }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
open = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
