# Traefik v3 dynamic configuration (M7 Task 8 / roadmap 7.1, GitHub #7).
#
# Loaded via traefik.yml's `providers.file` (hot-reloaded on change, no
# restart needed). Router/service labels themselves live on the `app` and
# `reverb-prod` compose services (see compose.yml) — this file only holds
# cross-cutting TLS options and a reusable security-headers middleware, so
# every router can opt in with a single `middlewares=` label instead of
# repeating header lists.

tls:
  options:
    default:
      # TLS 1.2 floor — current Traefik/Mozilla "intermediate" baseline.
      # Raise to mintls13-only if every client (browser + Discord's
      # server-to-server calls) is confirmed TLS 1.3-capable; not assumed
      # here since this also fronts a LAN party's mixed-device Wi-Fi.
      minVersion: VersionTLS12

http:
  middlewares:
    secure-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        referrerPolicy: strict-origin-when-cross-origin
        # camera=(self) stays allowed for future in-browser QR scanning at
        # check-in (no getUserMedia use in resources/js yet); everything else
        # sensitive is denied.
        permissionsPolicy: camera=(self), microphone=(), geolocation=(), payment=(), usb=()
        # Content-Security-Policy is deliberately NOT set: Filament/Livewire/
        # Alpine and the Inertia/Vite app need inline scripts/styles and
        # Reverb websockets, so a CSP needs an owner decision and a
        # report-only rollout first (see docs/deploy-lan-raute1.md,
        # "Security headers").
