# Maintenance page server (compose service `maintenance`). It answers EVERY request with the
# static page and status 503, so crawlers and monitors never index it as content.
# Mounted as a single file: changing it needs a container recreate (scripts/deploy/deploy.sh does that).
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Compose healthcheck target; Traefik's Docker provider only routes to a healthy container.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 503;
    }

    # The page. `error_page 503` keeps the 503 status; 405 is mapped back to 503 so a POST
    # (a form submitted during the deploy) gets the page too instead of nginx's static-file 405.
    error_page 503 /index.html;
    error_page 405 =503 /index.html;

    location = /index.html {
        internal;
        root /usr/share/nginx/html;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
