openapi: 3.1.0
info:
  title: LANoMAT API
  version: "1.0.0"
  summary: Recipes, files, identity and the MCP endpoint for agents.
  description: |
    The LANoMAT REST and MCP surface for the pi agent and other integrations.

    **Authentication.** Most endpoints use a bearer token obtained through the MCP device
    pairing flow (`POST /api/mcp/device`, then `POST /api/mcp/token`). The token belongs to
    the approving user and carries their role. `/mcp` uses the same token.

    The base URL is the LANoMAT host (`https://lan.example` at a LAN). Recipe file bytes live on
    the LAN file host; with `FILES_STORE=host` the download endpoint answers a short-lived signed
    redirect, with the default local store the app streams the file itself.

    **Recipes** are agent skills: `recipe.yaml` is the machine-readable plan, `SKILL.md` is the
    guidance an agent reads. A published recipe carries one required base or disc image; patches,
    mods, tools and avatars are optional.
  contact:
    name: LANoMAT
    url: https://github.com/raute1-org/LANoMAT
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://lan.example
    description: A LANoMAT deployment
  - url: http://localhost:8000
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: MCP Auth
    description: Device pairing and token exchange. No bearer token required.
  - name: MCP
    description: Streamable HTTP Model Context Protocol endpoint.
  - name: Identity
    description: The authenticated user and their LAN context.
  - name: Recipes
    description: The game recipe catalogue, skills, plans, files and avatars.
  - name: Files
    description: The LAN file host.
  - name: Servers
    description: The aggregated game servers of the active and recent events, plus permanent servers.
  - name: Terminals
    description: The launcher fleet — arcade and participant cabinets reporting their state.

x-tagGroups:
  - name: Agents
    tags:
      - MCP Auth
      - MCP
  - name: Identity
    tags:
      - Identity
  - name: Game recipes
    tags:
      - Recipes
  - name: Files
    tags:
      - Files
  - name: Game servers
    tags:
      - Servers
  - name: Launcher fleet
    tags:
      - Terminals

paths:
  /api/mcp/device:
    post:
      tags: [MCP Auth]
      operationId: startMcpDevicePairing
      summary: Start device pairing
      description: |
        Creates a device code for an agent. The human opens `verification_uri` (or
        `verification_uri_complete`, which carries the code) while logged in and approves the code.
        The agent then polls `POST /api/mcp/token` with `device_code`. Codes expire after
        `MCP_CODE_TTL` seconds (600 by default); the poll interval is `MCP_POLL_INTERVAL` (5 s).
        A malformed request answers `400 {"error":"invalid_request"}` (RFC 8628), not a validation
        error.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                device_name:
                  type: string
                  maxLength: 120
                  description: A label shown on the approval page, e.g. "pi on gaming-pc". Empty or missing means "LANoMAT agent".
                  examples: ["pi on gaming-pc"]
      responses:
        "200":
          description: Device code created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStart"
              example:
                device_code: dc_6f1c2a9e4b7d
                user_code: K7QF-2M9R
                verification_uri: https://lan.example/mcp/connect
                verification_uri_complete: https://lan.example/mcp/connect?code=K7QF-2M9R
                expires_in: 600
                interval: 5
        "400":
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/mcp/token:
    post:
      tags: [MCP Auth]
      operationId: exchangeMcpDeviceCode
      summary: Exchange device code
      description: |
        Poll this endpoint after starting device pairing. Until the human approves, it answers
        `400` with `{"error":"authorization_pending"}`; polling faster than the interval answers
        `slow_down` and raises the interval. An expired code answers `expired_token`, a denied one
        `access_denied`, an unknown one `invalid_grant`. The returned token is shown once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_code]
              properties:
                device_code:
                  type: string
                  maxLength: 128
                  description: The `device_code` from `POST /api/mcp/device`.
                  examples: ["dc_6f1c2a9e4b7d"]
      responses:
        "200":
          description: The device code was approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceToken"
              example:
                access_token: "lmcp_…"
                token_type: Bearer
                expires_in: 7776000
        "400":
          description: Pairing is pending, denied or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              examples:
                pending:
                  value:
                    error: authorization_pending
                slowDown:
                  value:
                    error: slow_down
                    interval: 10
                expired:
                  value:
                    error: expired_token
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /mcp:
    post:
      tags: [MCP]
      operationId: mcpStreamableHttp
      summary: Streamable HTTP
      description: |
        JSON-RPC 2.0 over streamable HTTP. Call `initialize`, then `notifications/initialized`, then
        `tools/list`, `resources/list` and `prompts/list`. A client may send
        `Accept: application/json, text/event-stream`; this server answers `application/json`.

        `initialize` echoes `2025-03-26`, `2025-06-18` or `2025-11-25` when asked for one of them and
        answers `2025-11-25` otherwise. A request that carries `_meta.protocolVersion` must name
        `2026-07-28`.

        The token is the paired device token. A missing, expired or revoked token answers `401`
        with `WWW-Authenticate: Bearer`. The endpoint is **stateless**: no `Mcp-Session-Id` is
        issued or required. `GET`/`DELETE /mcp` answer `405` with `Allow: POST`.

        **Tools (29):** `lanomat_me`, `events_list`, `event_get`, `event_register`, `teams_list`,
        `tournament_list`, `tournament_bracket`, `tournament_checkin`, `match_result`,
        `games_search`, `servers_list`, `files_list`, `file_download_url`, `schedule_list`,
        `polls_list`, `poll_vote`, `catering_menu`, `catering_menu_get`, `catering_menu_preview`,
        `catering_menu_import`, `catering_round_create`, `restaurants_list`, `lfg_list`, `lfg_create`, `recipes_list`,
        `recipe_get`, `recipe_install_plan`, `recipe_avatars`, `recipe_contribute` — the
        catalogue page is authoritative; the whole catalogue fits in one `tools/list` page (the
        server allows up to 50 per page).

        **Resources:** two templates, `lanomat://recipes/{slug}/skill` and
        `lanomat://skills/contribute-recipe`, and the static `lanomat://skills/import-menu`
        (all Markdown).

        **Prompts:** two, `install-game` and `import-menu`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpRequest"
            examples:
              initialize:
                summary: Initialize an MCP session
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: "2025-06-18"
                    capabilities: {}
                    clientInfo:
                      name: pi
                      version: "1.6.0"
              listRecipes:
                summary: Call a LANoMAT tool
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/call
                  params:
                    name: recipe_install_plan
                    arguments:
                      slug: ut2004
                      os: windows
      responses:
        "200":
          description: JSON-RPC response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpResponse"
              example:
                jsonrpc: "2.0"
                id: 2
                result:
                  content:
                    - type: text
                      text: '{"recipe":{"slug":"unreal-tournament-2004"},"os":"windows","files":[],"missing":[]}'
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Current user
      description: |
        The first call an agent makes after pairing. Returns the token's user, the server's name,
        URL, version and API version, the agent's default model and the enabled module keys. No
        e-mail address or Discord id is returned.
      responses:
        "200":
          description: The current identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              example:
                user:
                  id: 42
                  name: rene
                  role: participant
                  is_orga: false
                server:
                  name: LANoMAT
                  url: https://lan.example/
                  version: 1.4.0
                  mcp_url: https://lan.example/mcp
                  api_version: 1
                agent:
                  default_model: venice/e2ee-deepseek-v4-1-flash-1017-abliterated
                modules: [events, game_recipes, game_servers, games, mcp]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/recipes:
    get:
      tags: [Recipes]
      operationId: listRecipes
      summary: List recipes
      description: |
        Returns the viewer's catalogue, narrowed to the launcher lineup exactly like `/games`: the
        published recipes the lineup allows, plus the viewer's own drafts the lineup allows (an orga
        sees every status, still through the lineup). `query` is a case-insensitive fragment of a
        search term (slug, title, alias); there is no paging and no platform filter here
        (`recipes_list` in MCP has the `platform` filter). A draft outside the lineup is still
        readable by slug (`GET /api/v1/recipes/{slug}`).
      parameters:
        - name: query
          in: query
          description: Free-text fragment of a recipe's search terms (slug, title, alias).
          schema:
            type: string
          example: ut2004
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeList"
              example:
                data:
                  - slug: unreal-tournament-2004
                    title: Unreal Tournament 2004
                    summary: Install UT2004 from the LAN disc, patch to OldUnreal 3374, optionally add UT2004VR.
                    version: "3374"
                    status: published
                    platforms: [windows, linux]
                    installable: true
                    launcher_supported: true
                    in_lineup: true
                    pull_request: null
                    play_url: null
                    updated_at: "2026-11-18T20:14:00Z"
                  - slug: ridge-racer-type-4
                    title: Ridge Racer Type 4
                    summary: A self-hosted browser arcade cabinet with 2P netplay and Race Day.
                    version: "1.0.0"
                    status: published
                    platforms: [windows, linux]
                    installable: false
                    launcher_supported: true
                    in_lineup: true
                    pull_request: null
                    play_url: https://lan.example/arcade/rr4
                    updated_at: "2026-11-18T18:02:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Recipes]
      operationId: contributeRecipe
      summary: Contribute recipe
      description: |
        Creates a **draft** recipe from a `recipe.yaml`-shaped body and an optional `SKILL.md`. It
        does not publish. Orga review plus the JSON Schema validator
        (`resources/recipes/schema/validate.mjs`) is the gate. The server validates the same
        shape: at least one step and at most 50, at most 50 requirements, 3 platforms, 20 aliases,
        10 launch targets and 20 000 bytes of metadata; unknown keys are rejected. The keys are sent
        at the top level of the body (the MCP `recipe_contribute` tool takes the same set);
        `requires` and the older `requirements` are both accepted. `via` is always recorded as
        `api`. A second call with the slug of the caller's own draft **replaces** that draft — the
        body has to carry the complete recipe, a field left out is cleared. The answer's `catalog`
        object says what the git catalogue would refuse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeContribution"
            example:
              slug: trackmania-nations-forever
              title: Trackmania Nations Forever
              summary: Install Trackmania Nations Forever from the LAN installer.
              version: "1.0.0"
              homepage: https://www.trackmania.com/
              license: Ubisoft; installer is user-supplied
              platforms: [windows]
              aliases: [tmnf, trackmania nations]
              requires:
                - role: iso
                  label: TMNF installer
                  match: [TMNF*.exe, trackmania*nations*.exe]
                  required: true
                  shared_file_id: 9184
                - role: base
                  label: TMNF portable archive
                  match: [TMNF-portable*.zip]
                  required: true
                  os: windows
                  notes: Unpack the archive into the target folder.
              steps:
                - id: check-install
                  title: Unpack and check
                  os: windows
                  optional: false
                  detail: Unpack the archive into the target folder.
                  verify:
                    - type: file_exists
                      path: "{{target}}/TrackMania.exe"
              launch_targets:
                - id: windows
                  label: Windows
                  os: windows
                  command: "{{target}}/TrackMania.exe"
                  shell: powershell
                  notes: Starts the game directly.
              metadata:
                portable: true
                genre: racing
                players: 1-100
                players_max: 100
                lan_recommended: true
                multiplayer: true
                tags: [racing]
              skill_description: Install Trackmania Nations Forever on a LAN PC. Use when the user says install TMNF.
              skill_markdown: |
                ---
                name: trackmania-nations-forever
                description: "Install Trackmania Nations Forever on a LAN PC. Use when the user says install TMNF."
                ---

                # Trackmania Nations Forever
                …
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionResult"
              example:
                recipe:
                  slug: trackmania-nations-forever
                  title: Trackmania Nations Forever
                  status: draft
                  launcher_supported: true
                  pull_request: null
                catalog:
                  pull_requests_enabled: true
                  problems:
                    - "SKILL.md has 19 lines; the catalogue needs 60 to 150 lines (add the install guide sections)."
                    - "The draft has 1 step; the catalogue requires 3 to 6 steps for a draft (split or merge the guide)."
                  problems_when_published:
                    - "SKILL.md has 19 lines; the catalogue needs 60 to 150 lines (add the install guide sections)."
        "422":
          description: Validation failed — the body's own rules or the recipe schema check (every problem under `errors.recipe`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              example:
                message: 'requires[0].match must contain at least one glob (and 1 more error)'
                errors:
                  recipe:
                    - 'requires[0].match must contain at least one glob'
                    - 'steps must be a non-empty list'
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/recipes/{slug}:
    get:
      tags: [Recipes]
      operationId: getRecipe
      summary: Get one recipe
      description: |
        Returns one recipe the viewer may see, keyed under `recipe`: the recipe fields, the authored
        `requirements` and `steps` (the YAML shape), the launcher flags, the caller's
        `pull_request` and one entry per requirement with its LAN match (`lan_match`). An alias slug
        works like the recipe slug.

        The server fills `{{server_host}}` and `{{server_port}}` before the answer leaves:
        `launch_target`, `launch_targets[].command`, the steps' `commands[].run` and their `verify`
        entries. The value comes from a server whose game carries exactly this recipe's slug (no
        alias or name match), that is Ready or NotResponding and that the viewer may see (answering
        first, then permanent, then the lowest id); without one the placeholders are the empty
        string. `{{target}}` and `{{downloads}}` stay for the client to substitute.
      parameters:
        - $ref: "#/components/parameters/RecipeSlug"
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
              example:
                recipe:
                  slug: unreal-tournament-2004
                  title: Unreal Tournament 2004
                  summary: Install UT2004 from the LAN disc, patch to OldUnreal 3374, optionally add UT2004VR.
                  description: The LAN's baseline arena shooter.
                  version: "3374"
                  status: published
                  platforms: [windows, linux]
                  aliases: [ut2004, ut2k4, ut 2k4]
                  homepage: https://www.oldunreal.com/
                  license: Epic Games; base game files are user-supplied (UT2004VR is MIT)
                  play_url: null
                  launcher_supported: true
                  portable: false
                  pull_request: null
                  launch_target: Start-Process "{{target}}/System/UT2004.exe"
                  launch_targets:
                    - id: flat-windows
                      label: Flat
                      os: windows
                      shell: powershell
                      command: Start-Process "{{target}}/System/UT2004.exe"
                      notes: null
                  supports_multiplayer: true
                  install_command: lanomat-agent install unreal-tournament-2004
                  launch_command: lanomat-agent launch unreal-tournament-2004
                  requirements:
                    - role: iso
                      label: UT2004 DVD 1 (or GOG/Steam install)
                      match: [ut2004*.iso, UT2004*.iso]
                      required: true
                  steps:
                    - id: install-base
                      title: Install the base game from Disc 1
                      os: windows
                      optional: false
                      detail: Mount the DVD image, run Setup.exe and choose a full install.
                  files:
                    - id: 17
                      role: iso
                      label: UT2004 DVD 1 (or GOG/Steam install)
                      os: null
                      match: [ut2004*.iso, UT2004*.iso]
                      required: true
                      sha256: null
                      url: null
                      lan_match:
                        shared_file_id: 9182
                        name: UT2004-DVD1.iso
                        size_bytes: 4500000000
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recipes/{slug}/skill:
    get:
      tags: [Recipes]
      operationId: getRecipeSkill
      summary: Get skill
      description: |
        Returns the recipe's `SKILL.md` as Markdown, with its Agent Skills frontmatter. This is
        what an agent reads for the "when to use", optional questions, verification and
        troubleshooting. Read it before planning.
      parameters:
        - $ref: "#/components/parameters/RecipeSlug"
      responses:
        "200":
          description: The skill document.
          content:
            text/markdown:
              schema:
                type: string
              example: |
                ---
                name: ut2004
                description: "Install Unreal Tournament 2004 on a LAN PC … Use when the user says install ut2004."
                ---

                # Unreal Tournament 2004

                UT2004 is the LAN's baseline arena shooter. …

                ## Asking about avatars

                Avatars are `role: avatar` requirements. The installer shows every LAN match
                as a multi-select. Zero avatars is a valid answer.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recipes/{slug}/plan:
    post:
      tags: [Recipes]
      operationId: planRecipe
      summary: Plan install
      description: |
        Resolves the recipe against the LAN file host and returns the required and optional
        content, the target, every step and what is missing. **Pure:** no file is downloaded and
        no command runs. A missing required file is not an error: it is listed in `missing`
        (and as `status: missing` in `files`) with HTTP `200`. External entries are release
        pages (`status: manual`) unless they point at a direct asset file.

        `{{server_host}}` and `{{server_port}}` are filled before the answer leaves, from a server
        whose game carries exactly this recipe's slug (no alias or name match), that is Ready or
        NotResponding and that the viewer may see — answering first, then permanent, then the lowest
        id; without one both are the empty string. `{{target}}` and `{{downloads}}` stay for the
        client to substitute.
      parameters:
        - $ref: "#/components/parameters/RecipeSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
            example:
              os: windows
              event_slug: lan-2026
              dry_run: false
      responses:
        "200":
          description: The install plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
              example:
                recipe:
                  slug: unreal-tournament-2004
                  title: Unreal Tournament 2004
                  launch_target: Start-Process "{{target}}/System/UT2004.exe"
                  launch_targets:
                    - id: flat-windows
                      os: windows
                      shell: powershell
                      command: Start-Process "{{target}}/System/UT2004.exe"
                  play_url: null
                os: windows
                target_dir: "C:\\Games\\Unreal Tournament 2004"
                downloads_dir: "C:\\Games\\Unreal Tournament 2004/.lanomat-downloads"
                steps:
                  - id: install-base
                    title: Install from the LAN disc image
                    os: windows
                    optional: false
                files:
                  - requirement: iso
                    label: UT2004 DVD 1
                    status: matched
                    required: true
                    name: ut2004-dvd1.iso
                    size_bytes: 4500000000
                    source: lan
                downloads: []
                avatars: []
                missing: []
                generated_at: "2026-11-21T01:00:00+00:00"
        "422":
          description: Invalid `os` value (validation answer; content gaps are not errors — they are in `files`/`missing`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recipes/{slug}/files:
    get:
      tags: [Recipes]
      operationId: listRecipeFiles
      summary: List a recipe's files
      description: |
        Lists every file the recipe can use, with role, the platform it is authored for, whether it is
        required, its filename patterns and its state: `matched` (a LAN upload), `external` (the
        requirement's own URL names a file) or `missing`. A matched entry carries the LAN file's
        name, size, hash and the bearer download URL.
      parameters:
        - $ref: "#/components/parameters/RecipeSlug"
      responses:
        "200":
          description: Recipe files.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecipeFile"
              example:
                data:
                  - id: 17
                    role: iso
                    label: UT2004 DVD 1
                    os: null
                    required: true
                    match: [ut2004*.iso, UT2004*.iso]
                    status: matched
                    name: UT2004-DVD1.iso
                    size_bytes: 4500000000
                    sha256: null
                    download_url: https://lan.example/api/v1/files/9182/download
                  - id: 18
                    role: patch
                    label: OldUnreal UT2004 patch 3374
                    os: windows
                    required: true
                    match: [OldUnreal-UT2004Patch3374-*.zip]
                    status: missing
                    name: null
                    size_bytes: 183000000
                    sha256: null
                    download_url: null
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recipes/{slug}/avatars:
    get:
      tags: [Recipes]
      operationId: listRecipeAvatars
      summary: List avatars
      description: |
        Returns every avatar/content entry of the recipe (`role: avatar` or `content`). The
        installer presents these as one multi-select; zero is valid. An entry with no LAN file
        carries `available_on_lan: false` and no `download_url`.
      parameters:
        - $ref: "#/components/parameters/RecipeSlug"
        - name: query
          in: query
          description: Free-text filter over the label and author.
          schema:
            type: string
        - name: q
          in: query
          description: Older name for `query`; still accepted.
          schema:
            type: string
      responses:
        "200":
          description: Avatar options.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Avatar"
              example:
                data:
                  - id: recipe-file-31
                    recipe_slug: unreal-tournament-2004
                    label: Ayla (agile scout)
                    author: LANoMAT
                    license: CC BY 4.0
                    size_bytes: 18000000
                    sha256: null
                    match_name: ayla.vrm
                    available_on_lan: true
                    download_url: https://lan.example/api/v1/files/9201/download
                  - id: recipe-file-32
                    recipe_slug: unreal-tournament-2004
                    label: Mako (arena duelist)
                    author: LANoMAT
                    license: CC BY 4.0
                    size_bytes: 19000000
                    sha256: null
                    match_name: null
                    available_on_lan: false
                    download_url: null
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/servers:
    get:
      tags: [Servers]
      operationId: listServers
      summary: Aggregated game servers
      description: |
        The launcher's server browser: the servers of every active event, the most recently
        finished event and the permanent servers, in one list. The shape is the public web
        page's projection with no per-viewer narrowing and no player names; `occupants` is always
        `null` here (the bearer API carries no accounts), so a launcher can show the whole LAN
        without exposing user data. A server still starting appears with `status: provisioning`
        but no join link.
      responses:
        "200":
          description: The aggregated server browser.
          content:
            application/json:
              schema:
                type: object
                required: [events, servers]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [slug, name, status]
                      properties:
                        slug: { type: string }
                        name: { type: string }
                        status:
                          type: string
                          enum: [announced, registration, live, finished]
                  servers:
                    type: array
                    items:
                      type: object
                      required: [id, title, status, permanent]
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        game: { type: string, nullable: true }
                        gameSlug:
                          type: string
                          nullable: true
                          description: Stable game slug, for mapping the server to its install recipe.
                        description: { type: string, nullable: true }
                        matchLabel: { type: string, nullable: true }
                        address: { type: string, nullable: true }
                        port: { type: integer, nullable: true }
                        connectString: { type: string, nullable: true }
                        connectIsLink: { type: boolean }
                        status:
                          type: string
                          enum: [ready, not_responding, offline, provisioning]
                        permanent: { type: boolean }
                        source:
                          type: string
                          nullable: true
                          enum: [pelican, docker, external]
                          description: Set for permanent servers; null for event servers.
                        event:
                          type: object
                          nullable: true
                          properties:
                            slug: { type: string }
                            name: { type: string }
                            status: { type: string }
                        query:
                          type: object
                          nullable: true
                          properties:
                            serverName: { type: string }
                            map: { type: string }
                            players: { type: integer }
                            maxPlayers: { type: integer }
                            checkedAt: { type: string, nullable: true }
                        estimate:
                          type: object
                          nullable: true
                          description: Resource estimate for event servers; null for permanent servers or without a game.
                          properties:
                            ramMb: { type: integer }
                            maxRamMb: { type: integer }
                            overCap: { type: boolean }
                        installHint:
                          type: object
                          nullable: true
                          properties:
                            steamUrl: { type: string, nullable: true }
                            shareUrl: { type: string, nullable: true }
                            versionNote: { type: string, nullable: true }
                        joinOptions:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              label: { type: string }
                              url: { type: string }
                              hint: { type: string }
                        install:
                          type: object
                          nullable: true
                          description: |
                            How a player gets the game this server runs: the published recipe that installs it, from
                            the recipe catalogue, limited to the lineup (`LAUNCHER_LINEUP` plus the recipes the orga
                            switched on). Null when no such recipe matches the server's game, which is the normal
                            case for a curated game with no recipe or a game outside the lineup.
                          required: [recipeSlug, title, pageUrl, launcherSupported, launcherJoinUrl, lanReady]
                          properties:
                            recipeSlug:
                              type: string
                              description: The recipe slug; the launcher joins with it.
                            title:
                              type: string
                            pageUrl:
                              type: string
                              description: The game's page, `/games/<slug>`.
                            launcherSupported:
                              type: boolean
                              description: |
                                Whether the LANoMAT launcher can take this recipe from archive to running game
                                (the UT2004 pilot, the hand-verified NFSU2 recipe, a `play_url` recipe or a portable
                                one). GameServers does not decide this; the recipe catalogue does.
                            launcherJoinUrl:
                              type: string
                              nullable: true
                              description: |
                                One click: `lanomat://join/<slug>` with `?address=<host>:<port>` (UT2004, which
                                takes the server on its command line) or `?url=<urlencoded join url>` for the
                                server's own deep link. With only an address and no join URL the link carries no
                                query; the launcher installs the game and starts it, but cannot name the server —
                                the website labels that shape "Im Launcher starten" and the two query shapes
                                "Im Launcher beitreten". Null when the launcher cannot install the recipe, or
                                the server has neither a usable address+port nor an accepted join URL.
                              example: lanomat://join/unreal-tournament-2004?address=203.0.113.9:7777
                            lanReady:
                              type: boolean
                              description: |
                                Whether the game can be installed fresh from the LAN right now: every required
                                base archive or disc image of the recipe is an approved upload of a non-draft
                                event (pinned or matched by file name) or names an external download. It is the
                                install plan's own rule asked without a viewer and without an event, so it never
                                depends on who looks. The answer is cautious about platforms: one missing base
                                makes it false although another platform's base may be there, so a false value
                                means a fresh install *can* fail, not that it will.
                                `launcherJoinUrl` and `launcherSupported` do not depend on
                                it: false only blocks a fresh install, a PC that already has the game joins with
                                one click.
                              example: true
                        occupants:
                          type: object
                          nullable: true
                          description: |
                            Who of the LANoMAT accounts is on the server, as the website's server rows show
                            it. Always `null` on this bearer endpoint: the API carries no accounts.
                          properties:
                            people:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: integer }
                                  name: { type: string }
                                  avatarUrl: { type: string, nullable: true }
                            more: { type: integer }
              example:
                events:
                  - slug: lan-raute-1
                    name: Lan Raute 1
                    status: live
                servers:
                  - id: 11
                    title: Survival
                    game: Minecraft
                    status: ready
                    address: 203.0.113.9
                    port: 25565
                    connectString: 203.0.113.9:25565
                    connectIsLink: false
                    permanent: false
                    event: { slug: lan-raute-1, name: Lan Raute 1, status: live }
                    query: { serverName: Survival, map: world, players: 3, maxPlayers: 20 }
                    joinOptions: []
                    install: null
                    occupants: null
                  - id: 12
                    title: UT2004 Dauerwelt
                    game: Unreal Tournament 2004
                    gameSlug: unreal-tournament-2004
                    status: offline
                    permanent: true
                    event: null
                    joinOptions: []
                    install:
                      recipeSlug: unreal-tournament-2004
                      title: Unreal Tournament 2004
                      pageUrl: /games/unreal-tournament-2004
                      launcherSupported: true
                      launcherJoinUrl: null
                      lanReady: true
                  - id: 13
                    title: Skyline Rally Abendrunde
                    game: Skyline Rally
                    gameSlug: skyline-rally
                    status: ready
                    address: 203.0.113.24
                    port: 7777
                    connectString: 203.0.113.24:7777
                    connectIsLink: false
                    permanent: true
                    event: null
                    joinOptions: []
                    install:
                      recipeSlug: skyline-rally
                      title: Skyline Rally
                      pageUrl: /games/skyline-rally
                      launcherSupported: true
                      launcherJoinUrl: lanomat://join/skyline-rally
                      lanReady: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/terminals/heartbeat:
    post:
      tags: [Terminals]
      operationId: recordTerminalHeartbeat
      summary: Report a launcher terminal heartbeat
      description: |
        The launcher sends this every 30 seconds with its bearer token. The token is the
        terminal's identity: repeated heartbeats update the same row, a re-paired token
        creates a new one. `last_seen_at` and `ip` are server facts, never client claims.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 60 }
                os:
                  type: string
                  nullable: true
                  enum: [windows, linux, macos]
                arch: { type: string, maxLength: 16, nullable: true }
                version: { type: string, maxLength: 32, nullable: true }
                state:
                  type: string
                  nullable: true
                  enum: [online, playing, idle, offline]
                current_game_slug: { type: string, maxLength: 120, nullable: true }
                installed:
                  type: array
                  maxItems: 500
                  items: { type: string, maxLength: 120 }
                gamepad: { type: boolean, nullable: true }
      responses:
        "200":
          description: The heartbeat was recorded.
          content:
            application/json:
              schema:
                type: object
                required: [ok, terminal_id, server_time]
                properties:
                  ok: { type: boolean, enum: [true] }
                  terminal_id: { type: integer }
                  server_time: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The heartbeat payload is invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/terminals:
    get:
      tags: [Terminals]
      operationId: listTerminals
      summary: The launcher fleet
      description: |
        The orga monitor's fleet list: online terminals first, then by name. Requires an
        orga or admin token; a participant or helper token gets 403.
      responses:
        "200":
          description: All registered terminals.
          content:
            application/json:
              schema:
                type: object
                required: [data, heartbeat_seconds, offline_after_seconds, server_time]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, state, online, installed, gamepad]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        state:
                          type: string
                          enum: [online, playing, idle, offline]
                        online: { type: boolean }
                        os: { type: string, nullable: true }
                        arch: { type: string, nullable: true }
                        version: { type: string, nullable: true }
                        current_game_slug: { type: string, nullable: true }
                        installed:
                          type: array
                          items: { type: string }
                        installed_count: { type: integer }
                        gamepad: { type: boolean }
                        last_seen_at: { type: string, format: date-time, nullable: true }
                        ip: { type: string, nullable: true }
                        paired_user:
                          type: object
                          nullable: true
                          properties:
                            id: { type: integer }
                            name: { type: string }
                        token_name: { type: string, nullable: true }
                  heartbeat_seconds: { type: integer }
                  offline_after_seconds: { type: integer }
                  server_time: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The token's user may not view the fleet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/files:
    get:
      tags: [Files]
      operationId: listFiles
      summary: List files
      description: |
        Lists the files visible to the token's user in one public event: the approved ones plus the
        user's own pending ones. `query` filters the file name. There is no paging, and a file of
        another event or of an unpublished event is not listed.
      parameters:
        - name: event
          in: query
          required: true
          description: Event slug.
          schema:
            type: string
            maxLength: 120
          example: lan-raute-1
        - name: query
          in: query
          description: Search the file name.
          schema:
            type: string
            maxLength: 120
          example: ut2004
      responses:
        "200":
          description: The visible files of the event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileList"
              example:
                event_slug: lan-raute-1
                data:
                  - id: 9182
                    name: UT2004-DVD1.iso
                    size_bytes: 4500000000
                    visibility: approved
                    is_approved: true
                    mine: false
                    uploaded_at: "2026-11-17T19:21:00Z"
                    download_url: https://lan.example/api/v1/files/9182/download
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The `event` parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/files/{file}/download:
    get:
      tags: [Files]
      operationId: getFileDownload
      summary: Get download URL
      description: |
        The file itself, after a visibility check and the `download` policy. With the file-host
        store (`FILES_STORE=host`) the answer is a `302` to a short-lived signed URL on the LAN file
        host — scoped to one file and one expiry, tampering answers `403`, an expired link `410`.
        With the default local store the app streams the bytes (`200`, an opaque attachment). Fetch
        the URL with the same token; a redirect leads to a host reachable on the venue network.
      parameters:
        - name: file
          in: path
          required: true
          description: The file id from `GET /api/v1/files`.
          schema:
            type: integer
            format: int64
          example: 9182
      responses:
        "200":
          description: The file, streamed by the app (local store).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: Redirect to the signed LAN file host URL (file-host store).
          headers:
            Location:
              description: Signed URL on the file host.
              schema:
                type: string
                format: uri
              example: https://files.lan.example:8443/dl/event-7/9f3c?expires=1763751720&md5=…
            Cache-Control:
              description: Never cache a signed redirect.
              schema:
                type: string
                example: no-store, private
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The file exists but the token's user may not download it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: lmcp
      description: |
        A token from the MCP device pairing flow (`POST /api/mcp/device` →
        `POST /api/mcp/token`). Send `Authorization: Bearer lmcp_…`. The token carries the
        approving user's role and expires after `MCP_TOKEN_TTL_DAYS` (90 days by default), slid on
        use; revoking the device invalidates it immediately.

  parameters:
    RecipeSlug:
      name: slug
      in: path
      required: true
      description: The recipe slug (directory name in `resources/recipes/`).
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        maxLength: 64
      example: unreal-tournament-2004

  responses:
    Unauthorized:
      description: Missing, invalid or expired bearer token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Unauthenticated.
    NotFound:
      description: The recipe, file, event or server does not exist (or is not visible to the token's user).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Recipe not found.
    TooManyRequests:
      description: Rate limited (240 requests per minute per token and IP on the bearer API).
      headers:
        Retry-After:
          schema:
            type: integer
            example: 30
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Too Many Attempts.

  schemas:
    DeviceStart:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code:
          type: string
          description: Secret code the agent polls with. Never show it to the human.
        user_code:
          type: string
          description: Short code the human compares in the browser.
          example: K7QF-2M9R
        verification_uri:
          type: string
          format: uri
          example: https://lan.example/mcp/connect
        verification_uri_complete:
          type: string
          format: uri
          description: The approval page with the code prefilled.
          example: https://lan.example/mcp/connect?code=K7QF-2M9R
        expires_in:
          type: integer
          description: Seconds until the device code expires (`MCP_CODE_TTL`, 600 by default).
          example: 600
        interval:
          type: integer
          description: Minimum seconds between token polls (`MCP_POLL_INTERVAL`, 5 by default).
          example: 5

    DeviceToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Bearer token (`lmcp_…`). Shown once.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Lifetime in seconds (`MCP_TOKEN_TTL_DAYS`, 90 days by default; slid on use).
          example: 7776000

    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [authorization_pending, slow_down, access_denied, expired_token, invalid_grant, invalid_request]
        interval:
          type: integer
          description: The raised poll interval, on `slow_down` only.

    Me:
      type: object
      required: [user, server, agent, modules]
      properties:
        user:
          type: object
          required: [id, name, role, is_orga]
          properties:
            id:
              type: integer
            name:
              type: string
            role:
              type: string
              enum: [participant, helper, orga, admin]
            is_orga:
              type: boolean
        server:
          type: object
          required: [name, url, version, mcp_url, api_version]
          properties:
            name: { type: string }
            url: { type: string, format: uri }
            version: { type: string }
            mcp_url: { type: string, format: uri }
            api_version: { type: integer }
        agent:
          type: object
          properties:
            default_model:
              type: string
              description: The model the bundled installer configures (`MCP_DEFAULT_MODEL`).
        modules:
          type: array
          description: The enabled module keys.
          items:
            type: string

    RecipeSummary:
      type: object
      required: [slug, title, status, platforms, installable, launcher_supported, in_lineup]
      properties:
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, published, archived]
        platforms:
          type: array
          items:
            type: string
            enum: [windows, linux, macos]
        installable:
          type: boolean
          description: The entry has requirements, steps and a launch target, so an install is possible.
        launcher_supported:
          type: boolean
          description: |
            The native launcher can install or open this recipe (one decision, `LauncherSupport`):
            the UT2004 pilot, a verified recipe, a `play_url` browser recipe, a portable archive or
            an orga override.
        in_lineup:
          type: boolean
          description: Pinned to the launcher lineup by the orga, next to the configured lineup.
        pull_request:
          $ref: "#/components/schemas/PullRequest"
        play_url:
          type: string
          format: uri
          nullable: true
          description: Browser play URL; `{{host}}` is already substituted.
        updated_at:
          type: string
          format: date-time
          nullable: true

    RecipeList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"

    RecipeDetail:
      type: object
      required: [recipe]
      properties:
        recipe:
          type: object
          required: [slug, title, status, platforms, requirements, steps, files]
          properties:
            slug:
              type: string
            title:
              type: string
            summary:
              type: string
              nullable: true
            description:
              type: string
              nullable: true
            version:
              type: string
              nullable: true
            status:
              type: string
              enum: [draft, published, archived]
            platforms:
              type: array
              items:
                type: string
                enum: [windows, linux, macos]
            aliases:
              type: array
              items:
                type: string
            homepage:
              type: string
              nullable: true
            license:
              type: string
              nullable: true
            play_url:
              type: string
              nullable: true
              description: Browser play URL (`{{host}}` is replaced with the address the client used).
            launcher_supported:
              type: boolean
              description: The launcher can install or open this recipe (`LauncherSupport`).
            portable:
              type: boolean
              description: A ready-to-run archive the generic engine installs by unpacking and checking one file.
            pull_request:
              $ref: "#/components/schemas/PullRequest"
            launch_target:
              type: string
              nullable: true
              description: The default launch command for the caller's OS with the server variables filled, or null.
            launch_targets:
              type: array
              maxItems: 10
              description: Launch targets with the server variables filled into their commands.
              items:
                $ref: "#/components/schemas/LaunchTarget"
            supports_multiplayer:
              type: boolean
            install_command:
              type: string
              description: Human-readable hint (`lanomat-agent install <slug>`), not an executable path.
            launch_command:
              type: string
              description: Human-readable hint (`lanomat-agent launch <slug>`).
            requirements:
              type: array
              description: The authored `requires` list exactly as stored (YAML shape).
              items:
                $ref: "#/components/schemas/Requirement"
            steps:
              type: array
              description: The authored steps as stored, with the server variables filled into their `commands[].run` and `verify` entries (titles and `detail` stay as written).
              items:
                $ref: "#/components/schemas/Step"
            files:
              type: array
              description: One row per stored requirement, with its LAN match.
              items:
                type: object
                required: [id, role, label, required]
                properties:
                  id: { type: integer }
                  role: { type: string }
                  label: { type: string }
                  os:
                    type: string
                    nullable: true
                    description: The platform this file is authored for; null means any.
                  match:
                    type: array
                    items: { type: string }
                  required: { type: boolean }
                  sha256: { type: string, nullable: true }
                  url: { type: string, nullable: true }
                  lan_match:
                    type: object
                    nullable: true
                    properties:
                      shared_file_id: { type: integer }
                      name: { type: string }
                      size_bytes: { type: integer, format: int64 }

    Requirement:
      type: object
      required: [role, label, match, required]
      properties:
        role:
          type: string
          enum: [base, iso, patch, mod, tool, avatar, content, config]
        label:
          type: string
        match:
          type: array
          items:
            type: string
        required:
          type: boolean
        os:
          type: string
          nullable: true
          enum: [windows, linux, macos, any]
          description: Narrow the requirement (and its plan) to one platform.
        shared_file_id:
          type: integer
          nullable: true
          description: |
            Pin a LAN file the contributor may open (their own upload or an approved one) to this
            requirement. The pin lives on the recipe file, never in the recipe text.
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
        url:
          type: string
        notes:
          type: string
        author:
          type: string
          maxLength: 120
          description: Author of an avatar/content file.
        license:
          type: string
          maxLength: 200
          description: License of an avatar/content file.
        manual:
          type: boolean
          description: The requirement is satisfied by hand; it needs no matching file or URL.
        tags:
          type: array
          items:
            type: string

    Step:
      type: object
      required: [id, title, os, optional, detail]
      properties:
        id:
          type: string
        title:
          type: string
        os:
          type: string
          enum: [windows, linux, any]
        optional:
          type: boolean
        detail:
          type: string
        commands:
          type: array
          items:
            type: object
            required: [shell, run]
            properties:
              shell:
                type: string
                enum: [powershell, cmd, bash]
              run:
                type: string
        verify:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                enum: [file_exists, dir_exists, command]
              path:
                type: string
              command:
                type: string

    LaunchTarget:
      type: object
      required: [command]
      properties:
        id:
          type: string
          maxLength: 64
          description: Stable id (e.g. `flat`, `vr`, `windows`).
        label:
          type: string
          maxLength: 160
        os:
          type: string
          enum: [windows, linux, macos, any]
          default: any
        command:
          type: string
          maxLength: 2000
          description: The command the launcher runs; `{{target}}` is the install folder.
        shell:
          type: string
          nullable: true
          enum: [powershell, cmd, bash]
        notes:
          type: string
          nullable: true
          maxLength: 1000

    PullRequest:
      type: object
      nullable: true
      description: |
        The recipe's pull request into the git catalogue. Null while nothing was proposed and for
        a participant looking at somebody else's recipe.
      required: [state, label]
      properties:
        number:
          type: integer
          nullable: true
        url:
          type: string
          format: uri
          nullable: true
        state:
          type: string
          enum: [open, merged, closed, blocked, failed]
        label:
          type: string

    PlanRequest:
      type: object
      properties:
        os:
          type: string
          enum: [windows, linux, macos, win, mac]
          default: windows
          description: Target OS. `win`/`mac` are accepted aliases and normalised.
        event_slug:
          type: string
          description: Restrict LAN file matching to this public event.
        dry_run:
          type: boolean
          default: false
          description: Do not write a `game_recipe_installs` audit row.

    Plan:
      type: object
      required: [recipe, os, target_dir, downloads_dir, steps, files, downloads, avatars, missing, generated_at]
      properties:
        recipe:
          type: object
          required: [slug, title]
          properties:
            slug:
              type: string
            title:
              type: string
            version:
              type: string
              nullable: true
            skill:
              type: string
              description: Agent Skill name from SKILL.md.
            launch_target:
              type: string
              nullable: true
              description: Default launch command for the OS, with the server variables filled.
            launch_targets:
              type: array
              description: Launch targets with the server variables filled into their commands.
              items:
                $ref: "#/components/schemas/LaunchTarget"
            launch_command:
              type: string
              description: Human-readable hint (`lanomat-agent launch <slug>`), not an executable.
            play_url:
              type: string
              nullable: true
              description: Browser game URL; `{{host}}` is already substituted.
        os:
          type: string
          enum: [windows, linux, macos]
        target_dir:
          type: string
        downloads_dir:
          type: string
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [id, title, os]
            properties:
              id:
                type: string
              title:
                type: string
              os:
                type: string
                enum: [windows, linux, macos, any]
              optional:
                type: boolean
        files:
          type: array
          description: Every recipe requirement for the plan's `os`, matched or not. Files authored for the other platform are omitted.
          items:
            $ref: "#/components/schemas/PlanFile"
        downloads:
          type: array
          description: The subset of `files` with a URL (LAN match or external file).
          items:
            $ref: "#/components/schemas/PlanFile"
        avatars:
          type: array
          description: Avatar multi-select entries; zero is valid.
          items:
            $ref: "#/components/schemas/Avatar"
        missing:
          type: array
          description: Labels of required files with no LAN match and no URL.
          items:
            type: string
        generated_at:
          type: string
          format: date-time

    PlanFile:
      type: object
      required: [requirement, label, status, required]
      properties:
        recipe_file_id:
          type: integer
        requirement:
          type: string
          description: Role such as `base`, `iso`, `patch`, `mod`, `tool`, `avatar`.
        label:
          type: string
        os:
          type: string
          enum: [windows, linux, macos, any]
          nullable: true
          description: The platform this file is for; absent means any. Matched files for another OS never appear in the plan.
        status:
          type: string
          enum: [matched, missing, external, manual]
        required:
          type: boolean
        name:
          type: string
          description: LAN file name or external asset file name.
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
          nullable: true
        source:
          type: string
          enum: [lan, external, manual]
          nullable: true
        download_url:
          type: string
          nullable: true
          description: Bearer-authenticated LAN download or direct external asset URL.
        download_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Present when the link is signed and short-lived (the native client's file-host links).
        fallback_url:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          description: Release/page URL for manual entries.
        manual:
          type: boolean
        shared_file_id:
          type: integer
          nullable: true

    RecipeFile:
      type: object
      required: [id, role, label, required, status]
      properties:
        id:
          type: integer
          description: The recipe-file id (stable across a resync and a contribution edit).
        role:
          type: string
          description: Role such as `base`, `iso`, `patch`, `mod`, `tool`, `avatar`, `content`.
        label:
          type: string
        os:
          type: string
          enum: [windows, linux, macos, any]
          nullable: true
          description: The platform this file is authored for; null means any.
        required:
          type: boolean
        match:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [matched, external, missing]
          description: A LAN upload, the requirement's own file URL, or neither.
        name:
          type: string
          nullable: true
          description: The LAN file or external asset name; null when nothing matched.
        size_bytes:
          type: integer
          format: int64
          nullable: true
        sha256:
          type: string
          nullable: true
        download_url:
          type: string
          nullable: true
          description: The bearer LAN download URL, or the external URL; null when missing.

    Avatar:
      type: object
      required: [id, label, available_on_lan]
      properties:
        id:
          type: string
          description: '`recipe-file-<id>`, the same value the install plan uses.'
        recipe_slug:
          type: string
          nullable: true
          description: Null for an entry of the global avatar library (no recipe).
        label:
          type: string
        author:
          type: string
          nullable: true
        license:
          type: string
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
        sha256:
          type: string
          nullable: true
        match_name:
          type: string
          nullable: true
          description: The LAN file name; null when not uploaded.
        available_on_lan:
          type: boolean
        download_url:
          type: string
          nullable: true
          description: Bearer download URL; null when the entry is not on the LAN.

    FileEntry:
      type: object
      required: [id, name, size_bytes, visibility, is_approved, mine, download_url]
      properties:
        id:
          type: integer
        name:
          type: string
          description: The file name as the API shows it — control characters flattened, any path stripped, at most 120 characters.
        size_bytes:
          type: integer
          format: int64
        visibility:
          type: string
          enum: [pending, approved, rejected]
        is_approved:
          type: boolean
        mine:
          type: boolean
          description: The token's user uploaded this file.
        uploaded_at:
          type: string
          format: date-time
          nullable: true
        download_url:
          type: string

    FileList:
      type: object
      required: [event_slug, data]
      properties:
        event_slug:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"

    RecipeContribution:
      type: object
      required: [slug, title, steps]
      properties:
        slug:
          type: string
          maxLength: 120
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 10000
        version:
          type: string
          maxLength: 40
        homepage:
          type: string
          format: uri
          maxLength: 500
          nullable: true
        license:
          type: string
          maxLength: 200
        play_url:
          type: string
          format: uri
          maxLength: 500
          nullable: true
          description: Browser play URL; makes the recipe launcher-supported without an install.
        platforms:
          type: array
          maxItems: 3
          items:
            type: string
            enum: [windows, linux, macos]
        aliases:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 64
        requires:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Requirement"
        requirements:
          type: array
          maxItems: 50
          description: Older name for `requires`; both are accepted.
          items:
            $ref: "#/components/schemas/Requirement"
        steps:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Step"
        launch_targets:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/LaunchTarget"
        metadata:
          type: object
          description: Only `portable`, `genre`, `players`, `players_max`, `lan_recommended`, `tags`, `multiplayer` and — for an orga — `launcher_supported` are accepted from a contribution.
          properties:
            portable:
              type: boolean
            launcher_supported:
              type: boolean
              description: Orga-only override of the launcher decision; a participant's value is dropped.
            genre:
              type: string
              maxLength: 80
            players:
              type: string
              maxLength: 20
            players_max:
              type: integer
              minimum: 1
              maximum: 1024
            lan_recommended:
              type: boolean
            multiplayer:
              type: boolean
            tags:
              type: array
              maxItems: 20
              items:
                type: string
                maxLength: 40
        skill_description:
          type: string
          maxLength: 1024
        skill_markdown:
          type: string
          maxLength: 65535
          description: |
            The full SKILL.md, including Agent Skills front matter. A non-empty value replaces the text
            LANoMAT generates. The catalogue needs 60 to 150 lines (counted by splitting on newlines), front
            matter with `name` equal to the slug and a non-empty `description` of at most 1024 characters.
            Stored as sent; newline, carriage return and tab are the only control characters allowed.
            `lanomat://skills/contribute-recipe` holds a skeleton that passes.

    ContributionResult:
      type: object
      required: [recipe, catalog]
      properties:
        recipe:
          type: object
          required: [slug, title, status, launcher_supported, pull_request]
          properties:
            slug:
              type: string
            title:
              type: string
            status:
              type: string
              const: draft
            launcher_supported:
              type: boolean
              description: Whether the launcher can install the new draft as it stands.
            pull_request:
              $ref: "#/components/schemas/PullRequest"
        catalog:
          type: object
          description: |
            What the public git catalogue would refuse. Derived from this recipe's text only, so asking
            opens no pull request and writes no state.
          required: [pull_requests_enabled, problems, problems_when_published]
          properties:
            pull_requests_enabled:
              type: boolean
              description: Whether this installation proposes recipes to the git catalogue at all.
            problems:
              type: array
              description: Why the catalogue would refuse the recipe now; an empty list means the text is ready.
              items:
                type: string
            problems_when_published:
              type: array
              description: Why it would refuse the recipe once the orga published it, where the draft rules no longer apply.
              items:
                type: string

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    McpRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        method:
          type: string
          examples: [initialize, tools/list, tools/call, resources/read, prompts/get]
        params:
          type: object
          additionalProperties: true

    McpResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
              additionalProperties: true
