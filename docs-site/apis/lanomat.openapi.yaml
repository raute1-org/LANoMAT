openapi: 3.1.0
info:
  title: LANoMAT API
  version: "1.0.0"
  summary: Device pairing, identity, game recipes, avatars, files and the MCP endpoint.
  description: |
    The LANoMAT agent surface: a bearer-authenticated REST API under `/api/v1`, the device-pairing
    endpoints under `/api/mcp`, and the Model Context Protocol server at `/mcp`.

    **Authentication.** Pair once with a device code (`POST /api/mcp/device`, then poll
    `POST /api/mcp/token`). The resulting bearer token belongs to the approving user and carries
    their role. Every REST and MCP call uses the same token; neither accepts a browser session.

    The base URL is the LANoMAT host (`https://lan.example` at a LAN). Game files are downloaded with
    the bearer token: the app either streams the local attachment or redirects to a short-lived signed
    URL on the LAN file host.

    **Recipes** are agent skills: `recipe.yaml` is the machine-readable plan, `SKILL.md` is the
    guidance an agent reads. The base game is always required; mods and avatars are optional.
  contact:
    name: LANoMAT
    url: https://github.com/raute1-org/LANoMAT
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://lan.example
    description: A LANoMAT deployment
  - url: http://localhost:8000
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: MCP Auth
    description: Device pairing and token exchange. No bearer token required.
  - name: MCP
    description: Streamable HTTP Model Context Protocol endpoint.
  - name: Identity
    description: The authenticated user, server and enabled modules.
  - name: Recipes
    description: The game recipe catalogue, skills, plans, files and avatars.
  - name: Files
    description: The LAN file host.

x-tagGroups:
  - name: Agents
    tags:
      - MCP Auth
      - MCP
  - name: Identity
    tags:
      - Identity
  - name: Game recipes
    tags:
      - Recipes
  - name: Files
    tags:
      - Files

paths:
  /api/mcp/device:
    post:
      tags: [MCP Auth]
      operationId: startMcpDevicePairing
      summary: Start device pairing
      description: |
        Creates a device code for an agent. The human opens `verification_uri` (or
        `verification_uri_complete`, which pre-fills the code) while logged in and approves it.
        The agent then polls `POST /api/mcp/token` with `device_code`.

        Codes expire after 10 minutes; the default poll interval is 5 seconds. The endpoint is
        unauthenticated and limited to 10 starts per minute per IP.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                device_name:
                  type: string
                  maxLength: 120
                  description: A label shown on the approval page, e.g. "pi on gaming-pc".
                  examples: ["pi on gaming-pc"]
      responses:
        "200":
          description: Device code created.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStart"
              example:
                device_code: 6c1f0a9e4b7d2c8a5f3e1d9b7a6c4e2f1a8b3c5d7e9f0a2b
                user_code: K7QF-2M9R
                verification_uri: https://lan.example/mcp/connect
                verification_uri_complete: https://lan.example/mcp/connect?code=K7QF-2M9R
                expires_in: 600
                interval: 5
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/mcp/token:
    post:
      tags: [MCP Auth]
      operationId: exchangeMcpDeviceCode
      summary: Exchange device code
      description: |
        Poll this endpoint after starting device pairing. Until the human approves, it answers
        `400` with `{"error":"authorization_pending"}`. An expired code answers `expired_token`,
        a denied code `access_denied`, an unknown code `invalid_grant`. Polling faster than
        `interval` answers `slow_down` and raises the interval by five seconds.

        The returned token is shown once; only its SHA-256 digest is stored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_code]
              properties:
                device_code:
                  type: string
                  maxLength: 128
                  description: The `device_code` from `POST /api/mcp/device`.
      responses:
        "200":
          description: The device code was approved.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceToken"
              example:
                access_token: lmcp_9b2f4c1d7e6a8f3c5d0b9a7e5f3c1d2b4a6e8f0c
                token_type: Bearer
                expires_in: 7776000
        "400":
          description: Pairing is pending, denied, too fast or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              examples:
                pending:
                  value:
                    error: authorization_pending
                slow:
                  value:
                    error: slow_down
                    interval: 10
                expired:
                  value:
                    error: expired_token
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /mcp:
    post:
      tags: [MCP]
      operationId: mcpStreamableHttp
      summary: Streamable HTTP
      description: |
        JSON-RPC 2.0 over streamable HTTP. Send `Accept: application/json, text/event-stream`.
        Call `initialize`, then `notifications/initialized`, then `tools/list`,
        `resources/list` and `prompts/list`.

        The token is the paired device token. A missing or revoked token answers `401` with
        `WWW-Authenticate: Bearer`.

        **Tools (24):** `lanomat_me`, `events_list`, `event_get`, `event_register`, `teams_list`,
        `tournament_list`, `tournament_bracket`, `tournament_checkin`, `match_result`,
        `games_search`, `files_list`, `file_download_url`, `servers_list`, `schedule_list`,
        `polls_list`, `poll_vote`, `catering_menu`, `lfg_list`, `lfg_create`, `recipes_list`,
        `recipe_get`, `recipe_install_plan`, `recipe_avatars`, `recipe_contribute`.

        **Resource:** `lanomat://recipes/{slug}/skill` (`text/markdown`).

        **Prompt:** `install-game` with a `game` argument.

        Tools whose module is disabled are not registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpRequest"
            examples:
              initialize:
                summary: Initialize an MCP session
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: "2025-06-18"
                    capabilities: {}
                    clientInfo:
                      name: pi
                      version: "1.6.0"
              planRecipe:
                summary: Build an install plan
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/call
                  params:
                    name: recipe_install_plan
                    arguments:
                      slug: ut2004
                      os: windows
      responses:
        "200":
          description: JSON-RPC response or SSE stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpResponse"
              example:
                jsonrpc: "2.0"
                id: 2
                result:
                  content:
                    - type: text
                      text: '{"recipe":{"slug":"unreal-tournament-2004"},"os":"windows","missing":[]}'
            text/event-stream:
              schema:
                type: string
              example: |
                event: message
                data: {"jsonrpc":"2.0","id":2,"result":{"content":[{"type":"text","text":"plan ready"}]}}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Current user
      description: |
        The first call an agent makes after pairing. Returns the user, the server identity, the
        agent default model and the enabled module keys. There is no e-mail or Discord id in the
        response, and no "current event" — use `events_list` for that.
      responses:
        "200":
          description: The current identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              example:
                user:
                  id: 42
                  name: rene
                  role: participant
                  is_orga: false
                server:
                  name: LANoMAT
                  url: https://lan.example
                  version: 1.4.2
                  mcp_url: https://lan.example/mcp
                  api_version: 1
                agent:
                  default_model: venice/e2ee-deepseek-v4-1-flash-1017-abliterated
                modules: [events, games, identity, notifications, preflight, registration, seating, teams, tournaments]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/avatars:
    get:
      tags: [Recipes]
      operationId: listAvatars
      summary: List the avatar library
      description: |
        Every selectable avatar/content pack (`role: avatar` or `content`), optionally limited to
        one recipe. Entries with no LAN match have `available_on_lan: false` and a null
        `download_url`.
      parameters:
        - name: recipe
          in: query
          description: Recipe slug; omit for the global library.
          schema:
            type: string
        - name: q
          in: query
          description: Filter by label or author.
          schema:
            type: string
      responses:
        "200":
          description: Avatar options.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Avatar"
              example:
                data:
                  - id: recipe-file-18
                    recipe_slug: unreal-tournament-2004
                    label: VRM avatar · Ayla (agile scout)
                    author: LAN
                    license: CC-BY-4.0
                    size_bytes: 18000000
                    sha256: ""
                    match_name: ayla.vrm
                    available_on_lan: true
                    download_url: https://lan.example/api/v1/files/9201/download
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/recipes:
    get:
      tags: [Recipes]
      operationId: listRecipes
      summary: List recipes
      description: |
        Returns the recipes visible to the token, ordered by title. `query` matches title, slug and
        aliases; `platform` filters recipes that list the OS. Drafts are visible only to orga.
      parameters:
        - name: query
          in: query
          description: Title, slug or alias fragment (e.g. "ut2004").
          schema:
            type: string
            maxLength: 120
        - name: platform
          in: query
          description: Only recipes that support this platform.
          schema:
            type: string
            enum: [windows, linux, macos]
      responses:
        "200":
          description: The visible recipes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecipeSummary"
              example:
                data:
                  - slug: unreal-tournament-2004
                    title: Unreal Tournament 2004
                    summary: Install UT2004 from the LAN disc image, apply the OldUnreal 3374 patch, optionally add UT2004VR.
                    version: "3374"
                    status: published
                    platforms: [windows, linux]
                    updated_at: "2026-11-18T20:14:00+00:00"
                  - slug: ridge-racer-type-4
                    title: Ridge Racer Type 4
                    summary: Self-hosted browser arcade cabinet with 2P netplay, optional native recomp.
                    version: "1.0.0"
                    status: published
                    platforms: [windows, linux]
                    updated_at: "2026-11-18T18:02:00+00:00"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Recipes]
      operationId: contributeRecipe
      summary: Contribute recipe
      description: |
        Creates a **draft** recipe. Participants may contribute; an orga reviews the draft under
        `/admin` and publishes it. The body is flat (no nested `recipe` object): the same fields the
        `recipe_contribute` MCP tool accepts. The server validates slug uniqueness, the requirement
        and step shape, and stores the draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeContribution"
            example:
              slug: trackmania-nations-forever
              title: Trackmania Nations Forever
              summary: Install Trackmania Nations Forever from the LAN installer.
              description: A short prose description for the recipe page.
              platforms: [windows]
              aliases: [tmnf, trackmania nations]
              requirements:
                - role: iso
                  label: TMNF installer
                  match: [TMNF*.exe, trackmania*nations*.exe]
                  required: true
              steps:
                - id: install
                  title: Run the installer
                  os: windows
                  optional: false
                  detail: Run the installer and point it at the target folder.
              skill_description: Install Trackmania Nations Forever on a LAN PC. Use when the user says install TMNF.
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionResult"
              example:
                recipe:
                  slug: trackmania-nations-forever
                  title: Trackmania Nations Forever
                  status: draft
        "403":
          description: The user may not contribute.
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/recipes/{slug}:
    get:
      tags: [Recipes]
      operationId: getRecipe
      summary: Get one recipe
      description: |
        Returns the recipe with its requirement roles, steps, files and each file's LAN match.
        `slug` accepts any alias of the recipe (`ut2004` resolves to `unreal-tournament-2004`).
      parameters:
        - $ref: "#/components/parameters/RecipeSlug"
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                type: object
                required: [recipe]
                properties:
                  recipe:
                    $ref: "#/components/schemas/Recipe"
              example:
                recipe:
                  slug: unreal-tournament-2004
                  title: Unreal Tournament 2004
                  summary: Install UT2004 from the LAN disc image, apply the OldUnreal 3374 patch, optionally add UT2004VR.
                  description: Unreal Tournament 2004 is the arena shooter the LAN still measures every other deathmatch against…
                  version: "3374"
                  status: published
                  platforms: [windows, linux]
                  aliases: [ut2004, ut2k4, "ut 2k4", "unreal tournament", "ut 2004"]
                  homepage: https://www.oldunreal.com
                  license: "Epic Games; base game files are user-supplied (UT2004VR: MIT)"
                  play_url: null
                  launch_target: null
                  supports_multiplayer: true
                  install_command: lanomat-agent install unreal-tournament-2004
                  launch_command: lanomat-agent launch unreal-tournament-2004
                  requirements:
                    - role: iso
                      label: UT2004 DVD 1 (or GOG/Steam install)
                      match: [ut2004*.iso, ut2004*dvd*.iso, UT2004*.iso]
                      required: true
                      size_bytes: 4500000000
                  steps:
                    - id: patch-3374
                      title: Apply OldUnreal patch 3374 (Windows x64)
                      os: windows
                      optional: false
                      detail: Merge Help/, Sounds/ and System/ into the target.
                  files:
                    - id: 12
                      role: iso
                      label: UT2004 DVD 1 (or GOG/Steam install)
                      match: [ut2004*.iso, UT2004*.iso]
                      required: true
                      sha256: ""
                      url: ""
                      lan_match:
                        shared_file_id: 9182
                        name: ut2004-dvd1.iso
                        size_bytes: 4500000000
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recipes/{slug}/skill:
    get:
      tags: [Recipes]
      operationId: getRecipeSkill
      summary: Get skill
      description: |
        Returns the recipe's `SKILL.md` as Markdown, with its Agent Skills frontmatter. This is what
        an agent reads for the "when to use", optional questions, verification and troubleshooting.
        Read it before planning.
      parameters:
        - $ref: "#/components/parameters/RecipeSlug"
      responses:
        "200":
          description: The skill document.
          content:
            text/markdown:
              schema:
                type: string
              example: |
                ---
                name: ut2004
                description: "Install Unreal Tournament 2004 on a LAN PC … Use when the user says install ut2004."
                ---

                # Unreal Tournament 2004

                UT2004 is the LAN's baseline arena shooter. …

                ## Asking about avatars

                Avatars are `role: avatar` requirements. The installer shows every LAN match
                as a multi-select. Zero avatars is a valid answer.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recipes/{slug}/plan:
    post:
      tags: [Recipes]
      operationId: planRecipe
      summary: Plan install
      description: |
        Resolves the recipe against the LAN file host for one OS and returns the ordered steps, each
        file with its status (`matched`, `external`, `missing`), the target folder, the selected
        avatars and the missing labels. **Pure:** no file is downloaded and no command runs. Every
        plan is recorded for orga support.

        `os` defaults to `windows`; `win`/`mac` are normalized. `event_slug` restricts LAN matching
        to one event.
      parameters:
        - $ref: "#/components/parameters/RecipeSlug"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                os:
                  type: string
                  enum: [windows, linux, macos]
                  default: windows
                event_slug:
                  type: string
                  maxLength: 120
            example:
              os: windows
              event_slug: lan-raute-1
      responses:
        "200":
          description: The install plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
              example:
                recipe:
                  slug: unreal-tournament-2004
                  title: Unreal Tournament 2004
                  version: "3374"
                  skill: ut2004
                os: windows
                target_dir: C:\Games\Unreal Tournament 2004
                downloads_dir: C:\Games\Unreal Tournament 2004/.lanomat-downloads
                steps:
                  - id: patch-3374
                    title: Apply OldUnreal patch 3374 (Windows x64)
                    os: windows
                    optional: false
                    detail: Merge Help/, Sounds/ and System/ into the target.
                    commands:
                      - shell: powershell
                        run: Copy-Item -Path "{{downloads}}/UT2004Patch3374/*" -Destination "{{target}}" -Recurse -Force
                    verify:
                      - type: file_exists
                        path: "{{target}}/System/D3D11Drv.dll"
                files:
                  - recipe_file_id: 12
                    requirement: iso
                    label: UT2004 DVD 1 (or GOG/Steam install)
                    status: matched
                    required: true
                    source: lan
                    name: ut2004-dvd1.iso
                    size_bytes: 4500000000
                    sha256: ""
                    shared_file_id: 9182
                    download_url: https://lan.example/api/v1/files/9182/download
                    fallback_url: ""
                downloads:
                  - recipe_file_id: 12
                    requirement: iso
                    status: matched
                    download_url: https://lan.example/api/v1/files/9182/download
                avatars:
                  - id: recipe-file-18
                    recipe_file_id: 18
                    label: VRM avatar · Ayla (agile scout)
                    available_on_lan: true
                    download_url: https://lan.example/api/v1/files/9201/download
                missing: []
                generated_at: "2026-11-20T19:42:00+00:00"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recipes/{slug}/files:
    get:
      tags: [Recipes]
      operationId: listRecipeFiles
      summary: List a recipe's files
      description: |
        Lists every file the recipe can use, with role, size, optional hash and whether it is
        present on the LAN file host. `status` is `matched` (LAN), `external` (recipe URL only) or
        `missing`. Required content is marked.
      parameters:
        - $ref: "#/components/parameters/RecipeSlug"
      responses:
        "200":
          description: Recipe files.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecipeFile"
              example:
                data:
                  - id: 12
                    role: iso
                    label: UT2004 DVD 1
                    required: true
                    match: [ut2004*.iso, UT2004*.iso]
                    status: matched
                    name: ut2004-dvd1.iso
                    size_bytes: 4500000000
                    sha256: ""
                    download_url: https://lan.example/api/v1/files/9182/download
                  - id: 14
                    role: mod
                    label: UT2004VR
                    required: false
                    match: [UT2004VR-*.zip]
                    status: external
                    name: ""
                    size_bytes: 24000000
                    sha256: ""
                    download_url: https://github.com/jmkokko/ut2004-vr/releases/latest
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recipes/{slug}/avatars:
    get:
      tags: [Recipes]
      operationId: listRecipeAvatars
      summary: List avatars
      description: |
        Returns every LAN avatar/content pack that belongs to the recipe. The installer presents
        these as one multi-select; zero is valid. An entry with no LAN file has
        `available_on_lan: false` and no URL.
      parameters:
        - $ref: "#/components/parameters/RecipeSlug"
        - name: q
          in: query
          description: Filter by label or author.
          schema:
            type: string
      responses:
        "200":
          description: Avatar options.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Avatar"
              example:
                data:
                  - id: recipe-file-18
                    recipe_slug: unreal-tournament-2004
                    label: VRM avatar · Ayla (agile scout)
                    author: LAN
                    license: CC-BY-4.0
                    size_bytes: 18000000
                    sha256: ""
                    match_name: ayla.vrm
                    available_on_lan: true
                    download_url: https://lan.example/api/v1/files/9201/download
                  - id: recipe-file-22
                    recipe_slug: unreal-tournament-2004
                    label: VRM avatar · Mako (arena duelist)
                    author: LAN
                    license: CC-BY-4.0
                    size_bytes: 19000000
                    sha256: ""
                    match_name: null
                    available_on_lan: false
                    download_url: null
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/files:
    get:
      tags: [Files]
      operationId: listFiles
      summary: List files
      description: |
        Lists the approved files of one event plus the caller's own pending uploads. `event` is
        required; `query` filters by file name. There is no cursor.
      parameters:
        - name: event
          in: query
          required: true
          description: Event slug.
          schema:
            type: string
            maxLength: 120
          example: lan-raute-1
        - name: query
          in: query
          description: Filename fragment.
          schema:
            type: string
            maxLength: 120
          example: ut2004
      responses:
        "200":
          description: The visible files.
          content:
            application/json:
              schema:
                type: object
                required: [event_slug, data]
                properties:
                  event_slug:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileEntry"
              example:
                event_slug: lan-raute-1
                data:
                  - id: 9182
                    name: ut2004-dvd1.iso
                    size_bytes: 4500000000
                    visibility: approved
                    is_approved: true
                    mine: false
                    uploaded_at: "2026-11-17T19:21:00+00:00"
                    download_url: https://lan.example/api/v1/files/9182/download
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/files/{file}/download:
    get:
      tags: [Files]
      operationId: getFileDownload
      summary: Download one file
      description: |
        Downloads one file with the bearer token. The `download` policy is checked on this route, so
        a token without access answers `403`. For the local store the body is the file; for the LAN
        file host the route answers `302` with a short-lived signed URL and the bytes come from the
        host. Either way the agent must use the URL from `file_download_url` or the plan.
      parameters:
        - name: file
          in: path
          required: true
          description: The shared file id.
          schema:
            type: integer
            format: int64
          example: 9182
      responses:
        "200":
          description: The file bytes (local store).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: Redirect to a short-lived signed URL on the LAN file host.
          headers:
            Location:
              description: Signed host URL.
              schema:
                type: string
                format: uri
            Cache-Control:
              schema:
                type: string
                example: no-store, private
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The user may not download this file.
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: lmcp
      description: |
        A token from the MCP device pairing flow (`POST /api/mcp/device` →
        `POST /api/mcp/token`). Send `Authorization: Bearer lmcp_…`. The token carries the
        approving user's role, expires after 90 days by default and slides on use.

  parameters:
    RecipeSlug:
      name: slug
      in: path
      required: true
      description: Recipe slug or alias (directory name in `resources/recipes/`).
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        maxLength: 120
      example: unreal-tournament-2004

  responses:
    Unauthorized:
      description: Missing, invalid or revoked bearer token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthenticated.
    NotFound:
      description: The event, recipe or file does not exist or is not visible.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Not found.
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After:
          schema:
            type: integer
            example: 30

  schemas:
    DeviceStart:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code:
          type: string
          description: Secret code the agent polls with. Never show it to the human.
        user_code:
          type: string
          description: Short code the human types in the browser, formatted XXXX-XXXX.
          example: K7QF-2M9R
        verification_uri:
          type: string
          format: uri
          example: https://lan.example/mcp/connect
        verification_uri_complete:
          type: string
          format: uri
          description: The same URL with `?code=` pre-filled.
          example: https://lan.example/mcp/connect?code=K7QF-2M9R
        expires_in:
          type: integer
          description: Seconds until the device code expires.
          example: 600
        interval:
          type: integer
          description: Minimum seconds between token polls.
          example: 5

    DeviceToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Bearer token, prefixed `lmcp_`. Shown once.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Lifetime in seconds (90 days by default).
          example: 7776000

    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [authorization_pending, slow_down, access_denied, expired_token, invalid_grant]
        interval:
          type: integer
          description: Present on `slow_down`; the new minimum poll interval.

    Me:
      type: object
      required: [user, server, agent, modules]
      properties:
        user:
          type: object
          required: [id, name, role, is_orga]
          properties:
            id:
              type: integer
            name:
              type: string
            role:
              type: string
              enum: [participant, helper, orga, admin]
            is_orga:
              type: boolean
        server:
          type: object
          required: [name, url, version, mcp_url, api_version]
          properties:
            name:
              type: string
            url:
              type: string
              format: uri
            version:
              type: string
            mcp_url:
              type: string
              format: uri
            api_version:
              type: integer
        agent:
          type: object
          properties:
            default_model:
              type: string
        modules:
          type: array
          description: Enabled module keys.
          items:
            type: string

    RecipeSummary:
      type: object
      required: [slug, title, summary, version, status, platforms]
      properties:
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
          nullable: true
        version:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        platforms:
          type: array
          items:
            type: string
            enum: [windows, linux, macos]
        updated_at:
          type: string
          format: date-time
          nullable: true

    Recipe:
      type: object
      required: [slug, title, version, status, platforms, requirements, steps, files]
      properties:
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        version:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        platforms:
          type: array
          items:
            type: string
            enum: [windows, linux, macos]
        aliases:
          type: array
          items:
            type: string
        homepage:
          type: string
          nullable: true
        license:
          type: string
          nullable: true
        play_url:
          type: string
          nullable: true
        launch_target:
          type: string
          nullable: true
        supports_multiplayer:
          type: boolean
        install_command:
          type: string
          example: lanomat-agent install unreal-tournament-2004
        launch_command:
          type: string
          example: lanomat-agent launch unreal-tournament-2004
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
        files:
          type: array
          items:
            $ref: "#/components/schemas/RecipeFileDetail"

    Requirement:
      type: object
      required: [role, label, match, required]
      properties:
        role:
          type: string
          enum: [base, iso, patch, mod, tool, avatar, content, config]
        label:
          type: string
        match:
          type: array
          items:
            type: string
        required:
          type: boolean
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
        url:
          type: string
        notes:
          type: string
        tags:
          type: array
          items:
            type: string

    Step:
      type: object
      required: [id, title, os, optional, detail]
      properties:
        id:
          type: string
        title:
          type: string
        os:
          type: string
          enum: [windows, linux, any]
        optional:
          type: boolean
        detail:
          type: string
        commands:
          type: array
          items:
            type: object
            required: [shell, run]
            properties:
              shell:
                type: string
                enum: [powershell, cmd, bash]
              run:
                type: string
        verify:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                enum: [file_exists, dir_exists, command]
              path:
                type: string
              command:
                type: string

    Plan:
      type: object
      required: [recipe, os, target_dir, downloads_dir, steps, files, downloads, avatars, missing, generated_at]
      properties:
        recipe:
          type: object
          properties:
            slug:
              type: string
            title:
              type: string
            version:
              type: string
            skill:
              type: string
        os:
          type: string
          enum: [windows, linux, macos]
        target_dir:
          type: string
        downloads_dir:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
        files:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"
        downloads:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"
        avatars:
          type: array
          items:
            $ref: "#/components/schemas/Avatar"
        missing:
          type: array
          description: Labels of required content that is neither on the LAN nor at a URL.
          items:
            type: string
        generated_at:
          type: string
          format: date-time

    PlanItem:
      type: object
      required: [recipe_file_id, requirement, label, status, required]
      properties:
        recipe_file_id:
          type: integer
        requirement:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [matched, external, missing]
        required:
          type: boolean
        source:
          type: string
          nullable: true
          description: "`lan`, `external`, or null when the file is missing."
        name:
          type: string
        size_bytes:
          type: integer
          format: int64
          nullable: true
        sha256:
          type: string
          nullable: true
        shared_file_id:
          type: integer
          nullable: true
        download_url:
          type: string
          nullable: true
        fallback_url:
          type: string
          nullable: true

    RecipeFileDetail:
      type: object
      required: [id, role, label, match, required]
      properties:
        id:
          type: integer
        role:
          type: string
        label:
          type: string
        match:
          type: array
          items:
            type: string
        required:
          type: boolean
        sha256:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        lan_match:
          type: object
          nullable: true
          properties:
            shared_file_id:
              type: integer
            name:
              type: string
            size_bytes:
              type: integer
              format: int64

    RecipeFile:
      type: object
      required: [id, role, label, required, match, status]
      properties:
        id:
          type: integer
        role:
          type: string
        label:
          type: string
        required:
          type: boolean
        match:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [matched, external, missing]
        name:
          type: string
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
        sha256:
          type: string
          nullable: true
        download_url:
          type: string
          nullable: true

    Avatar:
      type: object
      required: [id, label, available_on_lan]
      properties:
        id:
          type: string
          example: recipe-file-18
        recipe_slug:
          type: string
          nullable: true
        label:
          type: string
        author:
          type: string
          nullable: true
        license:
          type: string
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
        sha256:
          type: string
          nullable: true
        match_name:
          type: string
          nullable: true
        available_on_lan:
          type: boolean
        download_url:
          type: string
          nullable: true

    FileEntry:
      type: object
      required: [id, name, size_bytes, visibility, is_approved, mine, download_url]
      properties:
        id:
          type: integer
        name:
          type: string
        size_bytes:
          type: integer
          format: int64
        visibility:
          type: string
          enum: [pending, approved, rejected]
        is_approved:
          type: boolean
        mine:
          type: boolean
        uploaded_at:
          type: string
          format: date-time
          nullable: true
        download_url:
          type: string

    RecipeContribution:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 120
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 500
        description:
          type: string
        platforms:
          type: array
          items:
            type: string
            enum: [windows, linux, macos]
        aliases:
          type: array
          items:
            type: string
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
        skill_description:
          type: string
          maxLength: 1024
        skill_markdown:
          type: string
          description: Full SKILL.md; when omitted the server renders one from skill_description.

    ContributionResult:
      type: object
      required: [recipe]
      properties:
        recipe:
          type: object
          required: [slug, title, status]
          properties:
            slug:
              type: string
            title:
              type: string
            status:
              type: string
              const: draft

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    McpRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        method:
          type: string
          examples: [initialize, tools/list, tools/call, resources/read, prompts/get]
        params:
          type: object
          additionalProperties: true

    McpResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
              additionalProperties: true
