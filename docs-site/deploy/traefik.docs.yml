# Traefik routing for the docs container.
#
# Copy these labels onto the `docs` service (compose) or set them as the
# container labels in Coolify/Portainer. The app keeps its own router for
# the same host; this one wins only for /docs.
#
# Replace `lan.example` with ${APP_DOMAIN}. Do NOT strip the /docs prefix:
# Zudoku's basePath is /docs, and assets, links and the OpenAPI reference all
# live below it. The container redirects / to /docs/ itself, so the same
# router also works unchanged if you serve the docs on their own subdomain
# (docs.example.com) — see "Subdomain vs path" below.
#
# The container listens on 8080 (nginx-unprivileged, uid 101), not 80.

labels:
  traefik.enable: "true"
  traefik.docker.network: "lanomat_default"

  # Router: host + path, higher priority than the app catch-all.
  traefik.http.routers.lanomat-docs.rule: "Host(`lan.example`) && PathPrefix(`/docs`)"
  traefik.http.routers.lanomat-docs.priority: "100"
  traefik.http.routers.lanomat-docs.entrypoints: "websecure"
  traefik.http.routers.lanomat-docs.tls: "true"
  traefik.http.routers.lanomat-docs.tls.certresolver: "letsencrypt"

  # Service: the container listens on :8080.
  traefik.http.services.lanomat-docs.loadbalancer.server.port: "8080"

  # Health: Traefik only routes to a container that answers /docs/.
  traefik.http.services.lanomat-docs.loadbalancer.healthcheck.path: "/docs/"
  traefik.http.services.lanomat-docs.loadbalancer.healthcheck.interval: "30s"
  traefik.http.services.lanomat-docs.loadbalancer.healthcheck.timeout: "5s"

# Deliberately no `secure-headers@file` middleware here (the app uses it).
# The docs container sets its own security headers, and the middleware would
# add a second X-Frame-Options with a different value (DENY vs SAMEORIGIN).
# It would also force sslRedirect on a router that is already TLS-only.
#
# Subdomain vs path
# -----------------
# Path (recommended, the app and docs share one certificate and origin):
#   Host(`lan.example`) && PathPrefix(`/docs`)
# Subdomain:
#   Host(`docs.example.com`)
# The container still serves its canonical base path, so docs.example.com
# answers / with a 302 to /docs/. Keep /docs in bookmarks and links either
# way; do not add a StripPrefix middleware.
#
# Equivalent dynamic file-provider config (if you do not use Docker labels):
#
# http:
#   routers:
#     lanomat-docs:
#       rule: "Host(`lan.example`) && PathPrefix(`/docs`)"
#       priority: 100
#       entryPoints: [websecure]
#       service: lanomat-docs
#       tls:
#         certResolver: letsencrypt
#   services:
#     lanomat-docs:
#       loadBalancer:
#         servers:
#           - url: "http://docs:8080"
#         healthCheck:
#           path: /docs/
#           interval: 30s
