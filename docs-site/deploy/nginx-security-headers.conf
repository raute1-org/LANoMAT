# Security headers for the static docs container.
#
# Included at server level AND in every location that sets its own
# add_header (currently /docs/assets/): nginx drops inherited add_header
# directives when a location defines one, so the set is repeated verbatim
# where needed. Keep the two in sync by editing only this file.
#
# The TLS terminator (Traefik) forwards these untouched. The docs router
# deliberately does NOT use the app's `secure-headers@file` middleware:
# that would duplicate X-Frame-Options with a different value (DENY vs
# SAMEORIGIN) and turn a healthy response into an ambiguous one.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Sent over plain HTTP too; browsers ignore it there and honour it once
# Traefik terminates TLS. No includeSubDomains/preload: the docs may share
# the app host, and the app's own Traefik middleware already sets the
# stricter value on that host.
add_header Strict-Transport-Security "max-age=31536000" always;

# No Content-Security-Policy yet: Zudoku ships an inline theme-boot script
# and inline styles, so a CSP needs `'unsafe-inline'` (or nonces injected
# into the prerendered HTML) and a report-only rollout first. Mirrors the
# app's decision in docker/traefik/dynamic.yml.
