# LANoMAT docs — static Zudoku site, canonical path /docs.
#
# The container ALWAYS serves the /docs prefix. Traefik matches
# `PathPrefix(`/docs`)` and must not strip it: Zudoku's basePath is /docs, so
# every link and asset URL in the prerendered HTML is absolute under /docs.
# A request for / on the container is redirected there (subdomain deployments
# therefore also work, see README "Deploy").
#
# Runtime is nginx-unprivileged: uid 101 (`nginx`), no root master, listen
# :8080, pid and temp paths under /tmp (that image's own nginx.conf).
#
# Caching policy:
#   /docs/assets/*      hashed by the Zudoku/Vite build  -> immutable, 1 year
#   /docs/screens/*     unhashed, replaced by a deploy   -> 1 hour
#   other static files  downloads, images, yaml, md      -> 1 hour
#   *.html              the deploy must be visible now   -> no-cache
#
# Security headers live in deploy/nginx-security-headers.conf and are
# included at server level AND in every location that uses add_header,
# because nginx drops inherited add_header directives as soon as a location
# defines its own (still true with `add_header_inherit on`, the default in
# nginx 1.29).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    # Relative Location headers. Behind Traefik the container sees Host
    # `lan.example` but listens on :8080; an absolute redirect would leak
    # `:8080` into the browser-visible URL. Path-only redirects avoid that.
    absolute_redirect off;

    # Formats the docs build emits that nginx's stock mime.types lacks
    # (application/yaml for the OpenAPI download, text/markdown for the
    # per-page .md sources) are added to /etc/nginx/mime.types in the
    # Dockerfile. Do NOT add a `types {}` block here: at server level it
    # REPLACES the inherited http-level mapping, and every css/js/font would
    # be served as application/octet-stream.

    # Compression for text and vector assets; images are already compressed.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    # `any` keeps compression on behind Traefik (the request carries Via /
    # X-Forwarded-* headers).
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/markdown
        application/javascript
        application/json
        application/xml
        application/yaml
        application/x-yaml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    include /etc/nginx/snippets/docs-security-headers.conf;

    # --- entry points -----------------------------------------------------

    # Root is not part of the site; the docs live under /docs. This is also
    # what makes a subdomain deployment (docs.example.com) work: the host
    # root redirects to the docs base path.
    location = / {
        return 302 /docs/$is_args$args;
    }

    # Canonicalise the prefix itself. `$is_args$args` keeps tracking/query
    # parameters such as ?utm_source=... intact across the redirect.
    location = /docs {
        return 301 /docs/$is_args$args;
    }

    # /docs/ is 200 (not a redirect) and serves the introduction page itself,
    # so the entry point is real documentation with JavaScript disabled too.
    # The build's dist/docs/index.html is only an 80-byte JS redirect to the
    # intro; nginx skips it deliberately.
    location = /docs/ {
        try_files /docs/start/introduction.html =404;
        expires -1;
    }

    # Short paths people type or that the app links to. The app's games
    # library lives at /games; its docs page is under /system. Same for the
    # MCP and agent overviews (mirrors zudoku.config.tsx's redirects, which
    # only apply to client-side navigation in dev).
    location = /docs/games {
        return 301 /docs/system/games-library$is_args$args;
    }

    location = /docs/mcp {
        return 301 /docs/mcp/overview$is_args$args;
    }

    location = /docs/agent {
        return 301 /docs/agent/overview$is_args$args;
    }

    # --- immutable build assets ------------------------------------------

    # Hashed Vite output: the file name changes with the content, so it can
    # be cached forever. Repeat the security headers (see the note above).
    location ^~ /docs/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/docs-security-headers.conf;
    }

    # --- screenshots: unhashed, replaced by a deploy ----------------------

    # Names are stable, so this cannot be immutable without a build-time hash
    # (not possible for hand-curated app captures). One hour keeps a deploy
    # visible quickly while still saving the repeated requests in the tour.
    location ^~ /docs/screens/ {
        try_files $uri =404;
        expires 1h;
    }

    # --- downloads and other static files --------------------------------

    # The OpenAPI YAML (/docs/api/1.0.0/lanomat-openapi.yaml), llms.txt,
    # per-page .md sources, favicons and the logo SVGs. Missing files are a
    # real 404, never the app shell.
    location ~* ^/docs/.+\.(png|jpe?g|gif|webp|avif|svg|ico|woff2?|yaml|yml|json|txt|md|xml|map)$ {
        try_files $uri =404;
        expires 1h;
    }

    # --- prerendered pages ------------------------------------------------

    # Direct .html requests: always revalidate so a deploy is visible at once.
    location ~* ^/docs/.+\.html$ {
        try_files $uri =404;
        expires -1;
    }

    # Extensionless deep links: /docs/api -> /docs/api.html,
    # /docs/recipes/ut2004 -> /docs/recipes/ut2004.html. Every route the
    # build knows is prerendered, so an unknown path is a real 404 with the
    # docs' own not-found page — no SPA catch-all that would answer 200 for
    # any typo. (Client-side-only routes do not exist; search is a dialog.)
    location /docs/ {
        try_files $uri $uri.html $uri/index.html =404;
        expires -1;
    }

    # --- errors -----------------------------------------------------------

    # dist/404.html (prerendered by Zudoku) is copied to the docroot root and
    # references /docs/assets, so it renders inside the normal shell.
    # `expires` does not apply to 404 responses, so Cache-Control is explicit
    # (and the security headers are repeated, see the note at the top).
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/docs-security-headers.conf;
    }

    # Nothing outside /docs and the status page is part of the site.
    location / {
        try_files $uri =404;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
