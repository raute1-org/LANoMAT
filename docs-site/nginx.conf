# LANoMAT docs — static Zudoku site under /docs.
# Served by nginx with an SPA fallback inside /docs only.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Compression for text and vector assets. Images are already compressed.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/yaml
        application/x-yaml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Security headers. The docs are static and load no third-party frames.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Root and /docs both land on the documentation.
    location = / {
        return 302 /docs/;
    }

    location = /docs {
        return 301 /docs/;
    }

    # Hashed build assets: immutable. Repeat the server headers because a
    # location-level add_header replaces the inherited set on nginx < 1.29.
    location ^~ /docs/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Screenshots and other public files: a week, revalidated after that.
    location ^~ /docs/screens/ {
        try_files $uri =404;
        expires 7d;
    }

    # The published OpenAPI document (if enabled) and static files.
    location ~* ^/docs/.*\.(svg|png|ico|webp|woff2?|yaml|yml|json|txt|md)$ {
        try_files $uri =404;
        expires 1h;
    }

    # HTML: always revalidate so a deploy is visible immediately.
    location ~* ^/docs/.*\.html$ {
        expires -1;
    }

    # SPA fallback under /docs only. Prerendered routes win, then index.html.
    location /docs/ {
        try_files $uri $uri.html $uri/ $uri/index.html /docs/index.html;
        expires -1;
    }

    # Zudoku status pages at the root of dist.
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri =404;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
