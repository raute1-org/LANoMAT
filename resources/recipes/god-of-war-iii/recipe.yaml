schema: lanomat.recipe/v1
slug: god-of-war-iii
title: 'God of War III'
aliases:
    [
        'gow3',
        'god of war 3',
        'god of war iii',
        'god of war iii remastered',
        'gow3 remastered',
    ]
version: '1.0.0'
status: draft
platforms: [windows, linux]
summary: Play God of War III on the LAN in RPCS3 with the user's PS3 disc and PS3 firmware; the PS4 Remastered version is a different build.
description: |
    God of War III is the PS3 finale of Kratos' Greek arc: the Titans, the
    Blade of Olympus and the climb to Zeus. RPCS3 runs the PS3 game from the
    user's own disc or a dumped game folder, with PS3 firmware installed.

    "Remastered" is the 2015 PS4 release, a different build: RPCS3 cannot run
    it. This recipe is the **PS3** game (BCUS98111 / BCES00510). The PS4
    remaster would need shadPS4 and is not covered here.

    The LAN collection's "God of War III Remastered" folder is the PS4-era
    install. Confirm which dump the user actually has before promising 60 fps.
    Needs verification on the LAN before this recipe leaves draft status.

homepage: https://github.com/RPCS3/rpcs3
license: 'Sony Santa Monica; game and firmware user-supplied'
cover: ''
skill:
    name: god-of-war-iii
    description: "Install God of War III with RPCS3, install PS3 firmware, add the user's PS3 disc, configure Vulkan and a controller, and verify the game boots. Use when the user says install God of War 3, GOW3 or God of War III for the LAN."
    compatibility: 'Windows 10/11 or Linux; RPCS3; ~40 GB disk; PS3 firmware; gamepad'
requires:
    - role: iso
      label: 'God of War III PS3 disc or game folder'
      match:
          [
              '*God of War III (USA)*',
              '*God of War III (Europe)*',
              '*God of War III (*.iso',
              '*BCUS98111*',
              '*BCES00510*',
              '*God of War 3 (*.iso',
              'God of War III',
          ]
      required: true
      sha256: ''
      url: ''
      notes: "PS3 version only: the folder containing PS3_GAME, or an ISO from the user's disc. USA BCUS98111, Europe BCES00510. The PS4 Remastered build is named 'God of War III Remastered' and is not an RPCS3 title."
    - role: base
      label: 'PS3 firmware (PS3UPDAT.PUP)'
      match: ['PS3UPDAT.PUP', 'PS3UPDAT*.PUP']
      required: true
      sha256: ''
      url: ''
      notes: "From the user's own PS3 (or Sony's official update file). RPCS3 installs it once per emulator profile."
    - role: tool
      label: 'RPCS3 emulator'
      match: ['rpcs3*.7z', 'rpcs3*.AppImage']
      required: true
      url: https://rpcs3.net/download
      notes: 'RPCS3 has rolling builds: Windows is a `rpcs3-v0.0.43-<build>_win64_msvc.7z`, Linux a `rpcs3-*_linux64.AppImage`, both from rpcs3.net/download (mirrored in the RPCS3/rpcs3-binaries-win and -linux repos). The main RPCS3/rpcs3 repo tags carry no assets. Extract the 7z to `{{target}}`; `rpcs3.exe` sits at its root.'
steps:
    - id: install-rpcs3
      title: 'Install RPCS3'
      os: windows
      optional: false
      detail: |
          Extract the RPCS3 7z to `{{target}}` (Windows `tar -xf`, or 7-Zip), or
          use the Linux AppImage. Launch once and let the first-run wizard
          create the config and `dev_flash` folders.
      commands:
          - shell: powershell
            run: 'tar -xf (Get-ChildItem "{{downloads}}/rpcs3-*_win64*.7z" | Select-Object -First 1).FullName -C "{{target}}"'
      verify:
          - type: file_exists
            path: '{{target}}/rpcs3.exe'
    - id: install-firmware
      title: 'Install PS3 firmware'
      os: any
      optional: false
      detail: |
          In RPCS3 use File → Install Firmware (or drag `PS3UPDAT.PUP` onto the
          window). The emulator must finish the firmware install before a game can
          boot; this is not optional.

          Use firmware from the user's own console or Sony's official update file.
    - id: import-game
      title: 'Add the game'
      os: any
      optional: false
      detail: |
          Add the disc folder (the one containing `PS3_GAME`) or the ISO in
          RPCS3's game list. Confirm the title and serial, and let RPCS3 install
          any game update it finds.

          Do not point RPCS3 at the PS4 Remastered folder: it is a different
          platform build.
    - id: configure-graphics
      title: 'Configure graphics and patches'
      os: any
      optional: false
      detail: |
          Use Vulkan, SPU LLVM, and 150–200% resolution scale if the GPU holds it.
          Enable VSync and the recommended CPU/GPU settings from RPCS3's game
          patch list.

          A 60 fps patch exists for some versions. Enable it in the Patch Manager
          only after checking the exact serial; it can break cutscenes.
    - id: configure-controller
      title: 'Map a controller'
      os: any
      optional: false
      detail: |
          Map a DualShock 4 or Xbox pad: face buttons, both sticks, L1/L2/R1/R2
          and the touchpad click. God of War's combos use the triggers heavily.

          Save the profile as "LAN pad" and test a combat encounter.
    - id: verify
      title: 'Reach the first boss'
      os: any
      optional: false
      detail: |
          Boot the game, play the intro and reach the first boss. Check the
          shader cache (first-run stutter), the audio and the controller.

          Draft recipe: the PS3 vs PS4 build distinction and the 60 fps patch
          still need a LAN check.
metadata:
    genre: action-adventure
    players: '1'
    players_max: 1
    lan_recommended: false
    tags: [action, ps3, playstation, rpcs3]
    launch:
        kind: exe
        target: '{{target}}/rpcs3.exe'
        notes: "Start the game from RPCS3's game list; the ISO or PS3_GAME folder is already registered."
