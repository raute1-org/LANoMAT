version: '2026-11-21'
status: published
platforms: [windows, linux, macos]
summary: 'Zero-install NFSU2 in Chrome or Brave: play Underground 2 Revived at nfsu2.xyz with WebGPU, meet the LAN group in a shared world, keep saves in the browser.'
description: |
    The browser path for Need for Speed: Underground 2: the community port
    Underground 2 Revived (th0mk/nfsu2-web) runs the PC game's x86 code as
    WebAssembly, draws Direct3D 9 through WebGPU and plays sound over Web
    Audio. Nothing is installed and no game file is picked by hand.

    `play_url` points at the operator's live server, https://nfsu2.xyz/.
    That server keeps its own copy of the game, so a player needs no NFSU2
    files at all: open the page, optionally pick a name, press Play. A LAN
    group meets on the same server by choosing the same world (Online,
    World; the main world or World 1 to 4, or a name of its own); a Link
    with `#room=` joins a world directly. Worlds filter players, they are
    not private, and the public server also carries other players.

    Requirements are a Chromium browser with WebGPU (Chrome, Edge, Brave,
    Opera) or Firefox where it has WebGPU (Windows and Apple Silicon macOS;
    on Linux Firefox needs `dom.webgpu.enabled`), WebAssembly SIMD, shared
    memory, a secure page (https, or localhost) and about 1 GB of free
    memory for the game. Chrome on Linux runs WebGPU on Vulkan, so the
    Mesa Vulkan driver must be installed; Intel Gen12+ and NVIDIA on Wayland
    are enabled by default, older graphics may need
    `chrome://flags/#enable-unsafe-webgpu`.

    Saves live in the browser on that PC. Cloud saves with an 8-word
    passphrase sync them to the server; there is no account and no e-mail.
    A completed PC save can be restored from a ZIP of the game's profile
    folder, but the site bundles no 100% save.

    Self-hosting is optional and needs the player's own PC copy patched to
    v1.2 (North America) with the exact SPEED2.EXE (4,800,512 bytes,
    SHA-256 f9dd86c054878ce6276beb07c1fd61874f7a1e4bf1f241b084c65b73e24168a7),
    plus Rust and wasi-sdk 34 to build the module. The code is MIT, but the
    generated game module is not licensed for redistribution and the
    upstream repository was archived on 9 November 2026; nfsu2.xyz keeps
    running and is developed privately. A self-hosted instance must be
    served over HTTPS for every PC except localhost.

    The public path was verified on the event laptop (Linux, Brave 157 and
    Chrome 157, Intel Arc 130V) on 2026-11-21; the recipe still needs
    verification on the LAN hardware at the venue, especially the venue
    uplink and a mixed set of attendee laptops.
homepage: https://github.com/th0mk/nfsu2-web
