schema: lanomat.recipe/v1
slug: apocalypse
title: Apocalypse
aliases: ['apocalypse', 'apocalypse psx', 'apocalypse starring bruce willis']
version: '1.0.0'
status: draft
platforms: [windows, linux]
summary: Play the 1998 PlayStation shooter Apocalypse in DuckStation with the user's own disc and a scph5501 BIOS.
description: |
    Apocalypse (1998) is the PlayStation third-person shooter with Bruce Willis
    as Trey Kincaid: four chapters, a lot of explosions and a soundtrack by
    Poe. DuckStation runs the user's own USA disc with a PlayStation BIOS.

    The LAN collection's Apocalypse folder is a native recomp/port
    (`repocalypse.exe`) with its own saves. This recipe keeps DuckStation as
    the portable baseline; the native build is a separate path.

    It is a short, loud single-player game; there is no LAN or split-screen
    mode.
    Needs verification on the LAN before this recipe leaves draft status.

homepage: https://www.duckstation.org/
license: 'Activision/Sony; disc and BIOS user-supplied'
cover: ''
skill:
    name: apocalypse
    description: "Install Apocalypse (1998, PS1) with DuckStation, add the user's disc and scph5501 BIOS, configure graphics and a controller, and verify the game boots. Use when the user says install Apocalypse or the Bruce Willis PS1 game for the LAN."
    compatibility: 'Windows 10/11 or Linux; DuckStation; ~700 MB disk; gamepad'
requires:
    - role: iso
      label: 'Apocalypse (USA) PS1 disc image'
      match: ['*Apocalypse*.bin', '*Apocalypse*.cue', '*Apocalypse*.chd']
      required: true
      sha256: ''
      url: ''
      notes: 'USA disc preferred. Keep the CUE beside its BIN; CHD is a single-file alternative.'
    - role: base
      label: 'PlayStation BIOS (scph5501.bin, NTSC-U)'
      match: ['scph5501.bin', 'scph*.bin']
      required: true
      sha256: ''
      url: ''
      notes: 'DuckStation needs a BIOS. NTSC-U scph5501.bin for the USA disc.'
    - role: tool
      label: 'DuckStation emulator'
      match: ['duckstation-*.zip', 'DuckStation*.zip', 'duckstation*.AppImage']
      required: true
      url: https://www.duckstation.org/
      notes: 'Current release; portable, with the BIOS folder beside the executable.'
steps:
    - id: install-duckstation
      title: 'Install DuckStation'
      os: windows
      optional: false
      detail: |
          Extract DuckStation to `{{target}}` or install the Linux build; launch
          once to create the settings and `bios` folder.
      commands:
          - shell: powershell
            run: 'Expand-Archive -Path "{{downloads}}/duckstation-windows-x64-release.zip" -DestinationPath "{{target}}" -Force'
      verify:
          - type: file_exists
            path: '{{target}}/duckstation-qt-x64-ReleaseLTCG.exe'
    - id: install-bios
      title: 'Add the PlayStation BIOS'
      os: any
      optional: false
      detail: |
          Copy `scph5501.bin` to `{{target}}/bios` and select it in
          Settings → BIOS. Never download a BIOS for the user.
      commands:
          - shell: powershell
            run: 'New-Item -ItemType Directory -Force -Path "{{target}}/bios" | Out-Null'
          - shell: powershell
            run: 'Copy-Item -Path "{{downloads}}/scph5501.bin" -Destination "{{target}}/bios/scph5501.bin" -Force'
          - shell: bash
            run: 'mkdir -p "{{target}}/bios"'
          - shell: bash
            run: 'cp "{{downloads}}/scph5501.bin" "{{target}}/bios/scph5501.bin"'
      verify:
          - type: file_exists
            path: '{{target}}/bios/scph5501.bin'
    - id: import-disc
      title: 'Import the disc'
      os: any
      optional: false
      detail: |
          Put the CUE/BIN or CHD in `{{target}}/Games` and add the folder in
          DuckStation. Confirm the serial and region before starting.

          Apocalypse uses CD audio; keep the complete BIN, not just track 1.
      commands:
          - shell: powershell
            run: 'New-Item -ItemType Directory -Force -Path "{{target}}/Games" | Out-Null'
          - shell: powershell
            run: 'Copy-Item -Path "{{downloads}}/Apocalypse (USA).cue" -Destination "{{target}}/Games/" -Force'
          - shell: bash
            run: 'mkdir -p "{{target}}/Games"'
          - shell: bash
            run: 'cp "{{downloads}}/Apocalypse (USA).cue" "{{target}}/Games/"'
      verify:
          - type: file_exists
            path: '{{target}}/Games/Apocalypse (USA).cue'
    - id: configure-graphics
      title: 'Configure graphics and the controller'
      os: any
      optional: false
      detail: |
          Use 4x–6x internal resolution, PGXP geometry correction, VSync and the
          native frame limit. Keep 4:3; the game's pre-rendered backgrounds assume
          it.

          Map both sticks, fire, jump and weapon switching to a pad. Test the
          lock-on and the grenade throw.
    - id: verify
      title: 'Play the first chapter'
      os: any
      optional: false
      detail: |
          Boot the game, finish the first chapter and save to a memory card.
          Check the intro, the music and the controller.

          Draft recipe: verify the BIOS region and the native repocalypse build on
          the LAN hardware.
metadata:
    genre: third-person-shooter
    players: '1'
    players_max: 1
    lan_recommended: false
    tags: [shooter, psx, playstation, duckstation]
    launch:
        kind: exe
        target: '{{target}}/duckstation-qt-x64-ReleaseLTCG.exe'
        notes: "Open Apocalypse from DuckStation's game list; the disc is already registered."
