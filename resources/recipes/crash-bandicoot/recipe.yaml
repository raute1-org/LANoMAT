schema: lanomat.recipe/v1
slug: crash-bandicoot
title: Crash Bandicoot
aliases: ['crash bandicoot', 'crash 1', 'crash bandicoot 1']
version: '1.0.0'
status: draft
platforms: [windows, linux]
summary: Play the original Crash Bandicoot on the LAN in DuckStation with the user's own PS1 disc and a scph5501 BIOS.
description: |
    Crash Bandicoot is the 1996 PlayStation platformer: Wumpa Island, Aku Aku,
    crates and the N. Sanity Beach. DuckStation runs the user's own USA disc
    with a PlayStation BIOS.

    The LAN collection also has a native `CrashBandicoot.exe` port. This recipe
    keeps DuckStation as the portable baseline; the native build is a separate
    path with its own saves and mods folder.

    Match only the first game: `Crash Bandicoot 2: Cortex Strikes Back` and
    `Crash Bandicoot 3: Warped` are different discs.
    Needs verification on the LAN before this recipe leaves draft status.

homepage: https://www.duckstation.org/
license: 'Sony/Naughty Dog; disc and BIOS user-supplied'
cover: ''
skill:
    name: crash-bandicoot
    description: "Install the original Crash Bandicoot with DuckStation, add the user's PS1 disc and scph5501 BIOS, configure graphics and a controller, and verify the game boots. Use when the user says install Crash Bandicoot or Crash 1 for the LAN."
    compatibility: 'Windows 10/11 or Linux; DuckStation; ~600 MB disk; gamepad'
requires:
    - role: iso
      label: 'Crash Bandicoot (USA) disc image'
      match:
          [
              '*Crash Bandicoot (USA)*',
              '*Crash Bandicoot (Europe)*',
              '*Crash Bandicoot (Japan)*',
              '*Crash Bandicoot (*.cue',
              '*Crash Bandicoot (*.bin',
              '*Crash Bandicoot (*.chd',
          ]
      required: true
      sha256: ''
      url: ''
      notes: 'The first game only, USA preferred. The patterns require the region parenthesis, so Crash Bandicoot 2: Cortex Strikes Back and Crash Bandicoot 3: Warped do not match.'
    - role: base
      label: 'PlayStation BIOS (scph5501.bin, NTSC-U)'
      match: ['scph5501.bin', 'scph*.bin']
      required: true
      sha256: ''
      url: ''
      notes: 'DuckStation needs a BIOS. NTSC-U scph5501.bin for the USA disc; PAL wants scph5502.bin.'
    - role: tool
      label: 'DuckStation emulator'
      match: ['duckstation-*.zip', 'DuckStation*.zip', 'duckstation*.AppImage']
      required: true
      url: https://www.duckstation.org/
      notes: 'Current release; portable, with the BIOS folder beside the executable.'
steps:
    - id: install-duckstation
      title: 'Install DuckStation'
      os: windows
      optional: false
      detail: |
          Extract the DuckStation release to `{{target}}`, or install the Linux
          AppImage/package. Launch it once so the settings and `bios` folder exist.
      commands:
          - shell: powershell
            run: 'Expand-Archive -Path "{{downloads}}/duckstation-windows-x64-release.zip" -DestinationPath "{{target}}" -Force'
      verify:
          - type: file_exists
            path: '{{target}}/duckstation-qt-x64-ReleaseLTCG.exe'
    - id: install-bios
      title: 'Add the PlayStation BIOS'
      os: any
      optional: false
      detail: |
          Copy `scph5501.bin` into `{{target}}/bios` and select it in
          Settings → BIOS. Never download a BIOS for the user.
      commands:
          - shell: powershell
            run: 'New-Item -ItemType Directory -Force -Path "{{target}}/bios" | Out-Null'
          - shell: powershell
            run: 'Copy-Item -Path "{{downloads}}/scph5501.bin" -Destination "{{target}}/bios/scph5501.bin" -Force'
          - shell: bash
            run: 'mkdir -p "{{target}}/bios"'
          - shell: bash
            run: 'cp "{{downloads}}/scph5501.bin" "{{target}}/bios/scph5501.bin"'
      verify:
          - type: file_exists
            path: '{{target}}/bios/scph5501.bin'
    - id: import-disc
      title: 'Import the disc'
      os: any
      optional: false
      detail: |
          Put the CUE/BIN or CHD in `{{target}}/Games` and add the folder in
          DuckStation. Confirm the title and serial: the first game, not Cortex
          Strikes Back or Warped.

          Keep a CUE beside its BIN and do not rename the referenced track.
      commands:
          - shell: powershell
            run: 'New-Item -ItemType Directory -Force -Path "{{target}}/Games" | Out-Null'
          - shell: powershell
            run: 'Copy-Item -Path "{{downloads}}/Crash Bandicoot (USA).cue" -Destination "{{target}}/Games/" -Force'
          - shell: bash
            run: 'mkdir -p "{{target}}/Games"'
          - shell: bash
            run: 'cp "{{downloads}}/Crash Bandicoot (USA).cue" "{{target}}/Games/"'
      verify:
          - type: file_exists
            path: '{{target}}/Games/Crash Bandicoot (USA).cue'
    - id: configure-graphics
      title: 'Configure graphics'
      os: any
      optional: false
      detail: |
          Use 4x–6x internal resolution, PGXP geometry correction and texture
          filtering, with VSync and the native frame limit. Keep 4:3: the game's
          pre-rendered backgrounds and collision assume it.

          If the user wants a widescreen hack, verify the crates and the bridge
          levels before keeping it.
    - id: configure-controller
      title: 'Map a controller'
      os: any
      optional: false
      detail: |
          Map the D-pad and the analog stick, jump, spin and crouch. Crash uses
          precise jumps; test the slide-jump and the hog ride.

          Save the profile as "LAN pad".
    - id: verify
      title: 'Finish N. Sanity Beach'
      os: any
      optional: false
      detail: |
          Boot the game, finish the first level, collect a gem path or a key and
          save. Check the intro, the music and the controller.

          Draft recipe: verify the BIOS region and the native port on the LAN
          hardware.
metadata:
    genre: platformer
    players: '1'
    players_max: 1
    lan_recommended: false
    tags: [platformer, psx, playstation, duckstation]
    launch:
        kind: exe
        target: '{{target}}/duckstation-qt-x64-ReleaseLTCG.exe'
        notes: "Open Crash Bandicoot from DuckStation's game list; the disc is already registered."
