schema: lanomat.recipe/v1
slug: shadow-of-the-colossus
title: Shadow of the Colossus
aliases: ['sotc', 'shadow of the colossus']
version: '1.0.0'
status: draft
platforms: [windows, linux]
summary: Play Shadow of the Colossus on the LAN in PCSX2 with the user's own PS2 disc and a PlayStation 2 BIOS.
description: |
    Shadow of the Colossus is the PS2 colossus-climbing adventure: sixteen
    bosses, a forbidden land and Agro. PCSX2 runs the user's own PS2 disc with a
    BIOS dump from the user's console.

    The LAN collection's "Shadow of the Colossus" folder is the PS4 remaster
    (`CUSA08809`) plus a native SotC-PC port, not the PS2 disc. This recipe is
    the PS2 original; the PS4 remaster needs shadPS4 and is not covered.

    A 60 fps patch exists for some revisions; the game was designed around 30
    fps, so leave it off unless the user asks.
    Needs verification on the LAN before this recipe leaves draft status.

homepage: https://pcsx2.net/
license: 'Sony; disc and BIOS user-supplied'
cover: ''
skill:
    name: shadow-of-the-colossus
    description: "Install Shadow of the Colossus with PCSX2, add the user's PS2 disc and BIOS, configure graphics and a controller, and verify the game boots. Use when the user says install Shadow of the Colossus or SotC for the LAN."
    compatibility: 'Windows 10/11 or Linux; PCSX2; ~4 GB disk; gamepad'
requires:
    - role: iso
      label: 'Shadow of the Colossus (USA) PS2 disc image'
      match:
          [
              '*Shadow*of*the*Colossus*.iso',
              '*shadow*of*the*colossus*.iso',
              '*Shadow*of*the*Colossus*.chd',
          ]
      required: true
      sha256: ''
      url: ''
      notes: 'PS2 disc, USA preferred. The PS4 remaster is a different game build (`CUSA08809`) and does not run in PCSX2.'
    - role: base
      label: 'PlayStation 2 BIOS'
      match: ['scph*.bin', '*bios*.bin']
      required: true
      sha256: ''
      url: ''
      notes: "Dumped from the user's own PS2. PCSX2 refuses to boot without a BIOS; region should match the disc."
    - role: tool
      label: 'PCSX2 emulator'
      match: ['pcsx2-*-windows-x64-Qt.7z', 'pcsx2*.AppImage']
      required: true
      url: https://pcsx2.net/
      notes: 'Windows: the portable `pcsx2-v2.x.y-windows-x64-Qt.7z` (the installer .exe is an alternative). Linux: the `pcsx2-*-linux-appimage-x64-Qt.AppImage`. Extract the 7z to `{{target}}`; `pcsx2-qt.exe` sits at its root.'
steps:
    - id: install-pcsx2
      title: 'Install PCSX2'
      os: windows
      optional: false
      detail: |
          Extract the PCSX2 7z to `{{target}}` (Windows `tar -xf`, or 7-Zip),
          or use the Linux AppImage. Launch the wizard once and let it create
          the data folders.
      commands:
          - shell: powershell
            run: 'tar -xf (Get-ChildItem "{{downloads}}/pcsx2-*-windows-x64-Qt.7z" | Select-Object -First 1).FullName -C "{{target}}"'
      verify:
          - type: file_exists
            path: '{{target}}/pcsx2-qt.exe'
    - id: install-bios
      title: 'Add the PS2 BIOS'
      os: any
      optional: false
      detail: |
          Put the user's BIOS dump in PCSX2's `bios` folder and select it in
          Settings → BIOS. The wizard can also import a folder.

          Do not use a BIOS from another region if the disc is USA; mismatches
          cause boot and save problems.
      commands:
          - shell: powershell
            run: 'New-Item -ItemType Directory -Force -Path "{{target}}/bios" | Out-Null'
          - shell: powershell
            run: 'Copy-Item -Path "{{downloads}}/scph70012.bin" -Destination "{{target}}/bios/" -Force'
          - shell: bash
            run: 'mkdir -p "{{target}}/bios"'
          - shell: bash
            run: 'cp "{{downloads}}/scph70012.bin" "{{target}}/bios/"'
      verify:
          - type: file_exists
            path: '{{target}}/bios/scph70012.bin'
    - id: import-disc
      title: 'Import the disc'
      os: any
      optional: false
      detail: |
          Put the ISO or CHD in `{{target}}/Games` and add the folder to PCSX2's
          game list. Confirm the serial and region before booting.

          CHD is supported; converting an ISO to CHD saves space without losing
          data.
      commands:
          - shell: powershell
            run: 'New-Item -ItemType Directory -Force -Path "{{target}}/Games" | Out-Null'
          - shell: powershell
            run: 'Copy-Item -Path "{{downloads}}/Shadow of the Colossus (USA).iso" -Destination "{{target}}/Games/" -Force'
          - shell: bash
            run: 'mkdir -p "{{target}}/Games"'
          - shell: bash
            run: 'cp "{{downloads}}/Shadow of the Colossus (USA).iso" "{{target}}/Games/"'
      verify:
          - type: file_exists
            path: '{{target}}/Games/Shadow of the Colossus (USA).iso'
    - id: configure-graphics
      title: 'Configure graphics'
      os: any
      optional: false
      detail: |
          Use the Vulkan renderer, 3x–4x internal resolution, and the default
          frame limit. Shadow of the Colossus is fill-rate heavy: drop to 2x if
          the GPU cannot hold 30 fps.

          Leave the 60 fps patch off by default. It changes the game's timing and
          is revision-specific.
    - id: configure-controller
      title: 'Map a controller'
      os: any
      optional: false
      detail: |
          Map movement, camera, jump/grab, sword and horse controls to a pad. The
          grip and the bow are pressure-sensitive on the PS2; a modern pad's
          analog triggers work when mapped to the pressure axes.

          Save the profile as "LAN pad".
    - id: verify
      title: 'Reach the first colossus'
      os: any
      optional: false
      detail: |
          Boot the game, ride out from the shrine, find and climb the first
          colossus. Check the intro, the horse and a save.

          Draft recipe: verify the BIOS region and the 30 fps frame pacing on the
          LAN hardware.
metadata:
    genre: action-adventure
    players: '1'
    players_max: 1
    lan_recommended: false
    tags: [adventure, ps2, playstation, pcsx2]
    launch:
        kind: exe
        target: '{{target}}/pcsx2-qt.exe'
        notes: "Start Shadow of the Colossus from PCSX2's game list; the disc is already registered."
