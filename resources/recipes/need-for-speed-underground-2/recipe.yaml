schema: lanomat.recipe/v1
slug: need-for-speed-underground-2
title: 'Need for Speed: Underground 2'
aliases: ['nfsu2', 'nfs underground 2', 'nfs:u2', 'underground 2', 'need for speed 2']
version: '1.2 + NFS Online'
status: published
platforms: [windows, linux]
summary: Install Need for Speed Underground 2 1.2 from the portable LAN archive, add the NFS-Online ASI client and join the LAN server on Windows or through Wine on Linux.
description: |
    Need for Speed Underground 2 is the LAN's open-city street racer: career
    garages, URL races and free roam, now with the community NFS-Online
    server instead of the shut-down EA online service.

    The base game is user-supplied. The preferred LAN file is
    `nfsu2-portable.zip`, a ready-to-copy 1.2 game tree that already carries
    `SPEED.EXE`, the `DATA/`, `CARS/` and `TRACKS/` folders and the Ultimate
    ASI Loader as `dinput8.dll`. Unpack it, strip the single wrapper folder
    and put `net_u2.asi` plus `net_u2.ini` into `scripts/`.

    NFS-Online is the community server and Windows x86 client plugin from
    https://github.com/moio9/NFS-Online-Server (AGPL-3.0-or-later). The ASI
    redirects the game's online service to the LAN host in `net_u2.ini`; the
    same file also enables the LAN lobby. The server itself runs on the game
    server host, not on every player PC.

    On Windows the game starts directly from `speed.exe`. On Linux it runs
    through Wine with the ASI loader override
    `WINEDLLOVERRIDES=dinput8=n,b`; Proton is a documented fallback when the
    installed Proton build exposes a working `proton` command. There is no
    native Linux build of the game.
homepage: https://github.com/moio9/NFS-Online-Server
license: 'EA; game files are user-supplied (NFS-Online: AGPL-3.0-or-later)'
cover: ''
skill:
    name: nfsu2
    description: 'Install Need for Speed Underground 2 1.2 on a LAN PC from the portable nfsu2-portable.zip archive, add the NFS-Online ASI client (net_u2.asi, net_u2.ini, dinput8.dll), point it at the LAN server and start the game on Windows or through Wine on Linux. Use when the user says install NFSU2, NFS Underground 2, NFS U2, or asks to set up Underground 2 for the LAN.'
    compatibility: 'Windows 10/11 or Linux with Wine/Proton; ~1.5 GB disk; the NFS-Online server host must be reachable on UDP 20000 and TCP 20921-20923'
requires:
    - role: base
      label: 'NFSU2 portable 1.2 (Windows game tree, no install)'
      os: windows
      match: ['nfsu2-portable*.zip', 'NFSU2-portable*.zip', 'nfsu2*.zip', 'NFSU2*.zip']
      required: true
      sha256: ''
      url: ''
      notes: 'Preferred LAN file: a ready-to-copy Need for Speed Underground 2 1.2 game tree. It contains SPEED.EXE, DATA/, CARS/, TRACKS/, SAVEDATA/ and usually dinput8.dll at the root and the ASI plugin under scripts/. Unpack it into {{target}} and strip the one top-level wrapper folder (`Need for Speed - Underground 2/`). A retail installer ZIP is accepted as the same base only when it already contains a flat game tree; the launcher verifies SPEED.EXE and the NFS-Online files after extraction.'
    - role: base
      label: 'NFSU2 portable 1.2 (same Windows tree under Wine)'
      os: linux
      match: ['nfsu2-portable*.zip', 'NFSU2-portable*.zip', 'nfsu2*.zip', 'NFSU2*.zip']
      required: true
      sha256: ''
      url: ''
      notes: 'Linux has no native build, so a Linux plan installs the same Windows portable tree and starts it through Wine or Proton. The requirement is duplicated with os: linux because the install-plan builder filters files by the plan OS; a Linux plan must still see the base archive. Keep the wrapper-stripping and verify steps identical to Windows.'
    - role: patch
      label: 'NFSU2 patch 1.2 (optional, when the portable tree is older)'
      match: ['nfsu2*patch*1.2*', 'NFSU2*patch*1.2*', 'nfsu2-patch*.zip', 'NFSU2-patch*.zip']
      required: false
      sha256: ''
      url: ''
      notes: 'Optional: the portable base is expected to be 1.2 already. When the LAN copy is an older 1.0/1.1 tree, this ZIP (or an installer tree that already contains SPEED.EXE) is extracted over {{target}} before the NFS-Online files are checked. A Windows-only 1.2 patch still installs on Linux because the game runs under Wine; it carries no OS-specific installer.'
    - role: mod
      label: 'NFS-Online client plugin (net_u2.asi)'
      match: ['net_u2.asi', 'net_u2*.asi', '*NFS-Online*.zip']
      required: false
      sha256: ''
      url: https://github.com/moio9/NFS-Online-Server
      notes: 'The ASI client from the NFS-Online repository (client 0.2.22 in server 1.1.3). When it is not already inside the portable base, the installer copies the matched net_u2.asi into {{target}}/scripts/net_u2.asi. Build it from source/client-zig or take the release asset; do not mix it with an older NFS-Online plugin that patches the same game code.'
    - role: config
      label: 'NFS-Online client config (net_u2.ini)'
      match: ['net_u2.ini', 'net_u2*.ini']
      required: false
      sha256: ''
      url: ''
      notes: 'The shipped clients/underground2/net_u2.ini. Set the same host in [network] and [lan] (the LAN host runs bootstrap 20921, lobby 20922, web 20923 and the race relay on UDP 20000). Keep inject_server = true and patches = true; the installer copies a matched file to {{target}}/scripts/net_u2.ini.'
    - role: tool
      label: 'Ultimate ASI Loader (dinput8.dll)'
      match: ['dinput8.dll', 'dinput8*.dll', 'Ultimate-ASI-Loader*.zip', 'ultimate-asi-loader*.zip']
      required: false
      sha256: ''
      url: https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases
      notes: 'The portable base usually already carries dinput8.dll at the game root; otherwise provide the Ultimate ASI Loader (x86 build) under this name. Wine must load it with WINEDLLOVERRIDES=dinput8=n,b. Do not rename it: the game only loads ASI plugins through dinput8.dll.'
steps:
    - id: install-base
      title: 'Unpack the portable game tree (Windows)'
      os: windows
      optional: false
      detail: |
          Unpack `nfsu2-portable*.zip` into `{{target}}` (for example
          `C:\Games\NFSU2`). The archive carries one wrapper folder
          (`Need for Speed - Underground 2/`); move its contents up so
          `SPEED.EXE` sits directly in `{{target}}`.

          When a separate 1.2 patch ZIP is on the LAN, extract it over
          `{{target}}` afterwards, merging and overwriting. A portable base
          that is already 1.2 needs no patch.

          Do not run a retail `Setup.exe`; this recipe installs the portable
          tree only and never asks for the DVD.
      commands:
          - shell: powershell
            run: |
                $zip = (Get-ChildItem "{{downloads}}/nfsu2-portable*.zip" | Select-Object -First 1).FullName
                Expand-Archive -Path $zip -DestinationPath "{{target}}" -Force
                $inner = Get-ChildItem "{{target}}" -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'SPEED.EXE') } | Select-Object -First 1
                if ($inner) { Get-ChildItem $inner.FullName -Force | Move-Item -Destination "{{target}}" -Force; Remove-Item $inner.FullName -Force }
      verify:
          - type: file_exists
            path: '{{target}}/speed.exe'
          - type: dir_exists
            path: '{{target}}/DATA'
    - id: install-base-linux
      title: 'Unpack the portable game tree (Linux)'
      os: linux
      optional: false
      detail: |
          The Linux plan installs the same Windows game tree: unpack
          `nfsu2-portable*.zip` into `{{target}}` (`~/Games/nfsu2` is a good
          choice). `bsdtar` reads the ZIP, keeps the original file names and
          works without an extra `unzip` package.

          The archive carries one wrapper folder; flatten it so `SPEED.EXE`
          and `scripts/` sit directly in `{{target}}`. A 1.2 patch ZIP is
          extracted over the same folder. The game itself starts through Wine
          or Proton, not natively.
      commands:
          - shell: bash
            run: 'mkdir -p "{{target}}"'
          - shell: bash
            run: 'zip=$(find "{{downloads}}" -maxdepth 1 -iname "nfsu2-portable*.zip" -print -quit); bsdtar -xf "$zip" -C "{{target}}"'
          - shell: bash
            run: 'wrapper=$(find "{{target}}" -mindepth 1 -maxdepth 1 -type d | head -n 1); if [ -n "$wrapper" ]; then if find "$wrapper" -maxdepth 2 -iname "speed.exe" | grep -q .; then mv "$wrapper"/* "{{target}}"/ 2>/dev/null || true; rmdir "$wrapper" 2>/dev/null || true; fi; fi'
      verify:
          - type: file_exists
            path: '{{target}}/speed.exe'
          - type: dir_exists
            path: '{{target}}/DATA'
    - id: install-nfs-online
      title: 'Add the NFS-Online client and set the LAN host (Windows)'
      os: windows
      optional: false
      detail: |
          The portable base normally already has `dinput8.dll` and a
          `scripts/` folder. Copy the matched `net_u2.asi` to
          `{{target}}/scripts/net_u2.asi` when it is not there, then edit
          `{{target}}/scripts/net_u2.ini`.

          Set the same server host in `[network]` and `[lan]`; the LAN server
          runs bootstrap 20921, lobby 20922, web 20923 and the race relay on
          UDP 20000. Keep `inject_server = true` and `patches = true`. On the
          LAN the host is the game-server address, not `localhost` on a
          player PC.
      commands:
          - shell: powershell
            run: |
                $scripts = Join-Path "{{target}}" 'scripts'
                New-Item -ItemType Directory -Path $scripts -Force | Out-Null
                if (-not (Test-Path (Join-Path $scripts 'net_u2.asi'))) {
                  $asi = (Get-ChildItem "{{downloads}}" -Recurse -Filter 'net_u2*.asi' | Select-Object -First 1).FullName
                  if ($asi) { Copy-Item $asi (Join-Path $scripts 'net_u2.asi') -Force }
                }
                $ini = Join-Path $scripts 'net_u2.ini'
                if (Test-Path $ini) { (Get-Content $ini) -replace '(?m)^\s*host\s*=.*$', 'host = 10.23.3.220' | Set-Content $ini }
      verify:
          - type: file_exists
            path: '{{target}}/scripts/net_u2.asi'
          - type: file_exists
            path: '{{target}}/dinput8.dll'
    - id: install-nfs-online-linux
      title: 'Add the NFS-Online client and set the LAN host (Linux)'
      os: linux
      optional: false
      detail: |
          Same client, same `scripts/` layout. Copy `net_u2.asi` into
          `{{target}}/scripts/` when the base does not carry it, then put the
          LAN server host into both `host =` lines of `net_u2.ini`.

          Wine loads the plugin through `dinput8.dll`; keep the 32-bit DLL at
          the game root. No native Linux replacement is needed.
      commands:
          - shell: bash
            run: 'mkdir -p "{{target}}/scripts"; if [ ! -f "{{target}}/scripts/net_u2.asi" ]; then asi=$(find "{{downloads}}" -iname "net_u2*.asi" -print -quit); if [ -n "$asi" ]; then cp "$asi" "{{target}}/scripts/net_u2.asi"; fi; fi'
          - shell: bash
            run: 'if [ -f "{{target}}/scripts/net_u2.ini" ]; then sed -i "s/^[[:space:]]*host[[:space:]]*=.*/host = 10.23.3.220/" "{{target}}/scripts/net_u2.ini"; fi'
      verify:
          - type: file_exists
            path: '{{target}}/scripts/net_u2.asi'
          - type: file_exists
            path: '{{target}}/dinput8.dll'
    - id: check-install
      title: 'Start the game and join the LAN lobby'
      os: any
      optional: false
      detail: |
          Start the game once and confirm the NFS-Online menu replaces the
          dead EA Online entry. Then open the LAN lobby and check that the
          server directory lists the LAN host.

          Start `SPEED.EXE` directly on Windows. On Linux start it through
          Wine (or Proton) with `WINEDLLOVERRIDES=dinput8=n,b`; without the
          override the ASI loader is not loaded and the game falls back to
          the offline menu.

          If the lobby stays empty, the host in both `net_u2.ini` sections is
          wrong or the server ports are blocked. The client never needs the
          original EA account.
      verify:
          - type: file_exists
            path: '{{target}}/speed.exe'
          - type: file_exists
            path: '{{target}}/scripts/net_u2.asi'
          - type: file_exists
            path: '{{target}}/dinput8.dll'
launch_targets:
    - id: windows-direct
      label: 'Windows (speed.exe)'
      os: windows
      shell: powershell
      command: 'Start-Process -FilePath "{{target}}/speed.exe" -WorkingDirectory "{{target}}"'
      notes: 'Default Windows start. The Ultimate ASI Loader (dinput8.dll) next to speed.exe loads scripts/net_u2.asi automatically; no extra flag is needed.'
    - id: linux-wine
      label: 'Linux (Wine + ASI override)'
      os: linux
      shell: bash
      command: 'WINEDLLOVERRIDES="dinput8=n,b" wine "{{target}}/speed.exe"'
      notes: 'Default Linux start. The override is required so Wine loads the Ultimate ASI Loader; without it net_u2.asi is ignored. A 32-bit Wine prefix is enough for this game.'
    - id: linux-proton
      label: 'Linux (Proton, optional fallback)'
      os: linux
      shell: bash
      command: 'WINEDLLOVERRIDES="dinput8=n,b" proton run "{{target}}/speed.exe"'
      notes: 'Optional fallback when the machine has a `proton` command from a Steam/Proton install. The launcher picks linux-wine first; choose this target manually only if the Wine run fails.'
metadata:
    genre: racing
    players: '2-6'
    players_max: 6
    lan_recommended: true
    live_url: 'http://10.23.3.220:20923/'
    tags: [racing, nfs, online, lan, wine]
