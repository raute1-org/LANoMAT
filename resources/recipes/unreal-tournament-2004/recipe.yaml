schema: lanomat.recipe/v1
slug: unreal-tournament-2004
title: Unreal Tournament 2004
aliases: ['ut2004', 'ut2k4', 'ut 2k4', 'unreal tournament', 'ut 2004']
version: '3374-rc3'
status: published
platforms: [windows, linux, macos]
summary: Install Unreal Tournament 2004 from a portable 3374 archive or the LAN disc, patch it on Windows, Linux or macOS, then play flat or optionally in VR.
description: |
    Unreal Tournament 2004 is the arena shooter the LAN still measures every
    other deathmatch against: Onslaught, Assault, Bombing Run, CTF and plain DM,
    all playable against bots or over the LAN.

    The base game is user-supplied. The preferred one-click LAN file is a
    portable 3374 archive for the player's OS (Windows, Linux or macOS): a
    ready-to-copy game tree that already carries OldUnreal's patched System
    folder, so no disc and no patch step are needed. Without it the recipe
    falls back to the UT2004 DVD (Disc 1 carries the full game; Disc 2 only adds
    maps and bonus content), an installer ZIP, or an existing GOG/Steam install,
    and applies the matching OldUnreal patch 3374.

    On Windows and Linux the fallback copies the disc's asset folders and lets
    the patch supply the whole System folder, which is the patch project's
    documented manual install: no retail Setup.exe, no Wine, no disc check. On
    macOS the OldUnreal 3374 macOS universal DMG supplies `UT2004.app` plus the
    native engine, and the disc's assets are copied next to it. The patch is
    64-bit only and needs Windows 7+, a 64-bit Linux or macOS on Apple Silicon
    or Intel.

    Optional extras, both LAN files: UT2004VR by jmkokko (MIT) turns the game
    into a SteamVR shooter with the gun in your hand (Windows only, offline bots
    only), and vrm2ut2004 (private repo, built on the LAN server) converts the
    VRM avatars picked from the file host into UT2004 characters. Ask the user
    flat or VR before installing; flat is the default.
homepage: https://www.oldunreal.com
license: 'Epic Games; game files are user-supplied (OldUnreal patch: free, Epic-approved; UT2004VR: MIT)'
cover: ''
skill:
    name: ut2004
    description: 'Install Unreal Tournament 2004 on a LAN PC from a portable 3374 archive, the UT2004 DVD image, an installer ZIP or an existing GOG/Steam copy, apply OldUnreal patch 3374 on Windows, Linux or macOS, then start it flat or optionally install UT2004VR with SteamVR and vrm2ut2004 avatars. Always ask flat or VR before installing. Use when the user says install ut2004, ut2k4, ut 2k4, unreal tournament, or asks to set up UT2004 for the LAN.'
    compatibility: 'Windows 7+, 64-bit Linux or macOS (OldUnreal 3374; no Wine needed); ~5 GB disk; VR needs Windows 10/11 + SteamVR'
requires:
    - role: iso
      label: 'UT2004 DVD 1 (or an existing GOG/Steam install)'
      match:
          [
              'ut2004*.iso',
              'UT2004*.iso',
              '*ut2004*dvd*.iso',
              '*UT2004*DVD*.iso',
              '*ut2004*base*.zip',
              'ut2004-portable*.zip',
          ]
      required: true
      sha256: ''
      # External fallback when the LAN has no base archive: the archive.org
      # item is a flat, already-installed 3369 tree (Maps/, Textures/, System/,
      # ...), so the OS patch below is still applied. The direct ia* host is
      # used instead of archive.org/download because the redirect currently
      # lands on a mirror that is ~25x slower from the LAN.
      url: 'https://ia800800.us.archive.org/25/items/unreal-tournament-2004_202405/Unreal%20Tournament%202004.zip'
      notes: "Disc 1 is enough for the full install; Disc 2 only has extra maps. A flat full-game ZIP is accepted as the same base source and the matching OS patch is still mandatory. The nosTEAM `ut2k4+keygen.zip` is an installer EXE, not a flat tree; it is deliberately NOT matched here because the native engine would extract only the installer wrapper. A portable 3374 base wins over this ISO role. An already-installed GOG/Steam copy is fine too, but a folder cannot match a glob: treat it as a manual target, skip this requirement and start at the patch step with {{target}} set to the existing install. The disc's own Setup.exe is optional; this recipe copies the asset folders instead."
    - role: base
      label: 'UT2004 portable 3374 (Windows x64, no install)'
      os: windows
      match:
          [
              'ut2004-portable-3374.zip',
              'UT2004-portable-3374.zip',
              '*UT2004*portable*.zip',
          ]
      required: false
      sha256: ''
      url: ''
      notes: 'Optional LAN file, preferred when the Orga provides it: a ready-to-copy patched game folder (OldUnreal 3374, Windows x64) zipped on the file host. It already carries System/, Maps/, Textures/ and Build.ini patched, so it wins over the ISO: unpack the archive into {{target}}, verify System/UT2004.exe and System/Build.ini, and skip the disc copy and the patch step. Without it the recipe installs from the ISO plus patch 3374 as before; the launcher prefers a matched base archive over a matched ISO. Windows only: the folder holds UT2004.exe and the D3D11 renderer, so a Linux plan uses the Linux base (or the ISO plus the Linux patch) instead.'
    - role: base
      label: 'UT2004 portable 3374 (Linux x64, no install)'
      os: linux
      match: ['ut2004-portable-3374-linux*', 'UT2004-portable-3374-linux*']
      required: false
      sha256: ''
      url: ''
      notes: 'Optional LAN file, preferred for a Linux plan: a ready-to-copy patched game tree (OldUnreal 3374, Linux x64) as .zip or .tar.bz2, already carrying System/ with the 64-bit UT2004 binary, the OpenAL/SDL libraries and a Build.ini reporting v3374. Unpack it into {{target}}, verify System/ut2004-bin-amd64 and System/Build.ini, make System/UT2004 executable and skip the ISO copy and the Linux patch step. The archive name carries the OS, so a Windows launcher never picks it up; without it a Linux plan falls back to the ISO plus the Linux patch.'
    - role: base
      label: 'UT2004 portable 3374 (macOS universal, no install)'
      os: macos
      match: ['ut2004-portable-3374-macos*', 'UT2004-portable-3374-macos*']
      required: false
      sha256: ''
      url: ''
      notes: 'Optional LAN file, preferred for a macOS plan: a ready-to-copy archive (OldUnreal 3374, macOS universal) as .zip or .tar.bz2. It contains UT2004.app plus the asset folders (Maps, Textures, Sounds, StaticMeshes, Animations and the rest of the game tree), so no ISO and no DMG patch step are needed. Unpack it, put UT2004.app in ~/Applications (or {{target}}) and the asset folders in ~/Library/Application Support/UT2004, then clear the quarantine flag if Gatekeeper complains. Without it a macOS plan falls back to the ISO plus the macOS 3374 DMG.'
    - role: patch
      label: 'OldUnreal UT2004 patch 3374 (Windows x64 zip)'
      os: windows
      match: ['OldUnreal-UT2004Patch3374-Windows-*.zip']
      required: true
      sha256: '16bd65fcf736163e1f00fbb9404a492489bea6869d87496dcd15c2fed4d96dd2'
      url: https://github.com/OldUnreal/UT2004Patches/releases/download/3374-rc3/OldUnreal-UT2004Patch3374-Windows-d906d39a.zip
      notes: 'Latest release 3374-rc3 (2026-11-03; patch 3374 is feature-complete). Windows asset OldUnreal-UT2004Patch3374-Windows-d906d39a.zip, 47,460,147 B, sha256 16bd65fcf736163e1f00fbb9404a492489bea6869d87496dcd15c2fed4d96dd2. The url and sha256 pin that exact asset, so the launcher can download it without a LAN copy. Contains Help/, Sounds/, System/, SystemARM64/, SystemLocalized/, Textures/ and Web/, including a 64-bit System/UT2004.exe, System/D3D11Drv.dll and System/Build.ini with Label=v3374.'
    - role: patch
      label: 'OldUnreal UT2004 patch 3374 (Linux x64 tar.bz2)'
      os: linux
      match: ['OldUnreal-UT2004Patch3374-Linux-*.tar.bz2']
      required: true
      sha256: 'd79eb45fda3ace2b7a68e6a0b9730b7d6602004b111e0b16f3f7cc28f3111572'
      url: https://github.com/OldUnreal/UT2004Patches/releases/download/3374-rc3/OldUnreal-UT2004Patch3374-Linux-fc0484d6.tar.bz2
      notes: 'Latest release 3374-rc3 (2026-11-03). Linux asset OldUnreal-UT2004Patch3374-Linux-fc0484d6.tar.bz2, 59,191,321 B, sha256 d79eb45fda3ace2b7a68e6a0b9730b7d6602004b111e0b16f3f7cc28f3111572. The url and sha256 pin that exact asset, so the launcher can download it without a LAN copy. Carries the whole System tree with the 64-bit System/UT2004 binary (ut2004-bin-amd64 symlink), OpenAL/SDL libraries and the patched UnrealScript packages, plus SystemARM64 for ARM64 hosts. Never use the Windows zip on Linux: a Linux launcher would unpack UT2004.exe and the D3D11 renderer.'
    - role: patch
      label: 'OldUnreal UT2004 patch 3374 (macOS universal dmg)'
      os: macos
      match: ['OldUnreal-UT2004Patch3374-macOS*.dmg']
      required: true
      sha256: '8c9bd030127c2fd37c2565aad59cb5f4dbb696909e01c1cb975aecf7e38b8e7c'
      url: https://github.com/OldUnreal/UT2004Patches/releases/download/3374-rc3/OldUnreal-UT2004Patch3374-macOS.dmg
      size_bytes: 61235839
      notes: 'Latest release 3374-rc3 (2026-11-03). macOS asset OldUnreal-UT2004Patch3374-macOS.dmg, 61,235,839 B, sha256 8c9bd030127c2fd37c2565aad59cb5f4dbb696909e01c1cb975aecf7e38b8e7c. The url and sha256 pin that exact asset, so the launcher can download it without a LAN copy. The DMG carries the universal UT2004.app with the native 64-bit engine and the patched System tree (Build.ini v3374); the disc or installer ZIP only supplies the asset folders. Never use the Windows zip or the Linux tarball on macOS.'
    - role: mod
      label: 'UT2004VR (optional SteamVR mod, Windows only)'
      os: windows
      match: ['UT2004VR-*.zip']
      required: false
      sha256: ''
      url: https://github.com/jmkokko/ut2004-vr/releases/latest
      notes: 'MIT. Verified release v0.1.1 (2026-11-20): UT2004VR-0.1.1.zip, 823,068 B, sha256 0b0d486b9c41126a56bee16db6ae87ef2aab6d89ca155791aae3467332ca6a5f. Needs OldUnreal 3374 64-bit Preview 23 or newer (the installer checks Build.ini for v3374 and a build date >= 2026-07-18; rc3 passes), Windows 10/11, SteamVR and motion controllers. Offline play against bots only: joining an online server gives the flat game.'
    - role: tool
      label: 'vrm2ut2004 (optional VRM avatar bridge, LAN server)'
      match: []
      required: false
      sha256: ''
      url: https://github.com/jawa-solutions/vrm2ut2004
      notes: 'Private repository; not readable without access (GitHub returns 404 to anonymous requests), so its build steps are unverified from outside. Clone and build it on the LAN server, then copy the generated UT2004 character packages to the clients.'
    - role: avatar
      label: 'VRM avatars (every .vrm file on the LAN file host)'
      match: ['*.vrm', '*.VRM']
      required: false
      tags: [avatar, vrm]
      notes: 'LAN files only: leave url empty, because the installer matches local SharedFiles and shows every hit as a multi-select. VRM 0.x and 1.0 both work as input to vrm2ut2004. Conversion is optional and happens on the LAN server; the base game and UT2004VR never depend on an avatar.'
steps:
    - id: choose-play-mode
      title: 'Ask first: flat or VR'
      os: any
      optional: false
      detail: |
          Ask the user one question before installing: **flat on a monitor, or VR?**
          Do not assume VR because a headset is plugged in.

          - **Flat** (default): the base game plus patch 3374 is complete. Works on
            Windows, Linux and macOS, no extra files.
          - **VR**: Windows 10/11 only, plus SteamVR, motion controllers and the
            `UT2004VR-*.zip` release. VR is offline bots only; online servers drop
            back to a flat screen. The VR mod is an optional step and can be added
            later without reinstalling the game.

          Before the disc path, look for the portable 3374 base archive of the
          player's OS on the LAN file host. It is already patched, so the base
          copy and the patch step are both skipped; the disc/ISO and patch remain
          the fallback.

          Record the answer, then run the matching steps. The install itself is the
          same either way.
    - id: install-base
      title: 'Copy the base game assets from Disc 1 (Windows)'
      os: windows
      optional: false
      detail: |
          Mount the DVD image and copy every disc folder except `System` into
          `{{target}}` (for example `C:\Games\UT2004`). The patch supplies the
          complete `System` folder; a retail `System` from the disc must not be
          mixed in, and on Linux it stops the game from starting.

          This is OldUnreal's documented manual install. Disc 2 only adds maps; it
          is optional. An existing GOG/Steam copy is a manual target: a folder
          cannot match the ISO glob, so skip the base requirement, point
          `{{target}}` at that install and start at the patch step.

          The drive letter comes from the mounted image, not a fixed `D:`. If
          Windows assigns none, give it one in Disk Management and rerun the copy
          command. The retail `Setup.exe` also works, but then the install is at
          whatever version the disc carries (3339 or 3369) and OldUnreal asks for
          the 3369 update plus the ECE Bonus Pack before a manual patch; the asset
          copy avoids that.
      commands:
          - shell: powershell
            run: |
                $iso = (Get-ChildItem "{{downloads}}/ut2004*.iso" | Where-Object { $_.Name -notmatch "(dvd|disc|cd)[ _-]?2" } | Select-Object -First 1).FullName
                $drive = (Mount-DiskImage -ImagePath $iso -PassThru | Get-Volume).DriveLetter
                Get-ChildItem "$($drive):\" -Directory | Where-Object { $_.Name -ne 'System' } | ForEach-Object { Copy-Item $_.FullName -Destination "{{target}}" -Recurse -Force }
      verify:
          - type: file_exists
            path: '{{target}}/Maps/DM-Rankin.ut2'
    - id: install-base-linux
      title: 'Copy the base game assets from Disc 1 (Linux)'
      os: linux
      optional: false
      detail: |
          The retail installer is a 32-bit Windows program, but Wine is not needed:
          unpack the ISO with `bsdtar` (libarchive reads ISO9660/Joliet), then copy
          every folder except `System` into `{{target}}` (`~/Games/UT2004` is a
          good choice). Directory names on the disc are case-sensitive.

          `bsdtar` comes from libarchive. If it is missing, mount the image
          (`sudo mount -o loop,ro ...`) and copy the same folders by hand. A GOG
          distribution can be unpacked with `innoextract`; a Steam/Proton copy can
          be used as `{{target}}` directly.

          Do not copy the disc's `System` folder: the patch brings the 64-bit
          System tree, and old packages there keep the game from launching.
      commands:
          - shell: bash
            run: 'mkdir -p "{{downloads}}/ut2004-iso"'
          - shell: bash
            run: 'iso=$(find "{{downloads}}" -maxdepth 1 -iname "ut2004*.iso" ! -iname "*dvd*2*" ! -iname "*disc*2*" -print -quit); bsdtar -xf "$iso" -C "{{downloads}}/ut2004-iso"'
          - shell: bash
            run: 'for d in "{{downloads}}/ut2004-iso"/*/; do case "$d" in */System/) ;; *) cp -r "$d" "{{target}}/" ;; esac; done'
      verify:
          - type: file_exists
            path: '{{target}}/Maps/DM-Rankin.ut2'
    - id: install-base-macos
      title: 'Copy the base game assets from Disc 1 (macOS)'
      os: macos
      optional: false
      detail: |
          Only for the ISO fallback; when a `ut2004-portable-3374-macos*` archive
          is on the LAN, unpack it and skip this step and `patch-3374-macos`.

          Mount the DVD image read-only with `hdiutil`, copy every disc folder
          except `System` into `~/Library/Application Support/UT2004`, then
          unmount. The macOS patch supplies `UT2004.app` with the patched
          `System` tree; a retail `System` copied next to it keeps the game from
          starting.

          If the LAN file is an installer ZIP instead (`ut2k4*.zip`), unpack it
          with `ditto -x -k` and copy the same asset folders. An existing
          GOG/Steam copy is a manual target: use its asset folder and skip the
          base requirement.
      commands:
          - shell: bash
            run: 'mkdir -p "$HOME/Library/Application Support/UT2004" "{{downloads}}/ut2004-iso"'
          - shell: bash
            run: 'iso=$(find "{{downloads}}" -maxdepth 1 -iname "ut2004*.iso" ! -iname "*dvd*2*" ! -iname "*disc*2*" -print -quit); hdiutil attach "$iso" -mountpoint "{{downloads}}/ut2004-iso" -nobrowse -readonly'
          - shell: bash
            run: 'for d in "{{downloads}}/ut2004-iso"/*/; do case "$d" in */System/) ;; *) cp -R "$d" "$HOME/Library/Application Support/UT2004/" ;; esac; done'
          - shell: bash
            run: 'hdiutil detach "{{downloads}}/ut2004-iso"'
      verify:
          - type: file_exists
            path: '~/Library/Application Support/UT2004/Maps/DM-Rankin.ut2'
    - id: patch-3374
      title: 'Apply OldUnreal patch 3374 (Windows x64)'
      os: windows
      optional: false
      detail: |
          Download the Windows zip from the OldUnreal releases page, extract it and
          copy the whole extracted tree over `{{target}}`, merging and
          overwriting. It is not just `System/`: the archive also carries `Help/`,
          `Sounds/`, `SystemARM64/`, `SystemLocalized/`, `Textures/` and `Web/`.
          It is the patched game tree, not an installer, and no `Setup.exe` runs.

          Back up the game folder first if it was a working install. After the
          copy, `System\UT2004.exe` is the 64-bit build (x86-64), `D3D11Drv.dll` is
          the new DirectX 11 renderer (the fastest option on Windows 11) and
          `System\Build.ini` reports `v3374`. The patched client does not ask for
          the DVD, so the image can be dismounted.

          Patch 3374 is network-compatible with 3369 and drops 32-bit CPUs, Vista
          and older, so the LAN needs 64-bit machines on Windows 7 or newer.
      commands:
          - shell: powershell
            run: |
                $patch = (Get-ChildItem "{{downloads}}/OldUnreal-UT2004Patch3374-Windows-*.zip" | Select-Object -First 1).FullName
                Expand-Archive -Path $patch -DestinationPath "{{downloads}}/UT2004Patch3374" -Force
          - shell: powershell
            run: 'Copy-Item -Path "{{downloads}}/UT2004Patch3374/*" -Destination "{{target}}" -Recurse -Force'
          - shell: powershell
            run: '$iso = (Get-ChildItem "{{downloads}}/ut2004*.iso" | Where-Object { $_.Name -notmatch "(dvd|disc|cd)[ _-]?2" } | Select-Object -First 1).FullName; Dismount-DiskImage -ImagePath $iso'
      verify:
          - type: file_exists
            path: '{{target}}/System/UT2004.exe'
          - type: file_exists
            path: '{{target}}/System/D3D11Drv.dll'
          - type: file_exists
            path: '{{target}}/System/Build.ini'
    - id: patch-3374-linux
      title: 'Apply OldUnreal patch 3374 (Linux x64)'
      os: linux
      optional: false
      detail: |
          Extract `OldUnreal-UT2004Patch3374-Linux-*.tar.bz2` directly into
          `{{target}}`. The tarball carries the whole System tree, including the
          64-bit `System/UT2004` binary (with `ut2004-bin-amd64` as a symlink to
          it), the OpenAL/SDL libraries and the patched UnrealScript packages.

          Make `System/UT2004` executable and start the game directly with it.
          There is no launcher script and no Wine.

          On ARM64 (Raspberry Pi 5 and similar) the patch adds `SystemARM64`; copy
          `System/Packages.md5` to `SystemARM64/Packages.md5` or link it, as the
          release notes require. Delete stale packages listed in the patch README
          only when patching an old (<= 3369) install; a fresh asset copy has none.
      commands:
          - shell: bash
            run: 'tar -xjf "{{downloads}}"/OldUnreal-UT2004Patch3374-Linux-*.tar.bz2 -C "{{target}}"'
          - shell: bash
            run: 'chmod +x "{{target}}/System/UT2004"'
      verify:
          - type: file_exists
            path: '{{target}}/System/ut2004-bin-amd64'
          - type: file_exists
            path: '{{target}}/System/Build.ini'
    - id: patch-3374-macos
      title: 'Apply OldUnreal patch 3374 (macOS universal)'
      os: macos
      optional: false
      detail: |
          Download `OldUnreal-UT2004Patch3374-macOS.dmg` (or take it from the LAN
          file host), mount it with `hdiutil` and copy `UT2004.app` either into
          `~/Applications` or into `{{target}}`. If the DMG carries additional
          asset folders, merge them into `~/Library/Application Support/UT2004`;
          the app reads the game data there.

          The app is not notarised by Apple, so Gatekeeper may refuse the first
          start. `xattr -dr com.apple.quarantine` on the app is the optional
          one-time fix (or System Settings → Privacy & Security → Open Anyway).
          Detach the DMG afterwards; the patched app does not ask for the DVD.

          On Apple Silicon the universal app runs natively; no Rosetta and no
          Wine are needed. Build.ini inside the app bundle reports v3374. When a
          portable macOS archive was used as the base, skip this step.
      commands:
          - shell: bash
            run: 'dmg=$(find "{{downloads}}" -maxdepth 1 -iname "OldUnreal-UT2004Patch3374-macOS*.dmg" -print -quit); mkdir -p "{{downloads}}/ut2004-dmg"; hdiutil attach "$dmg" -mountpoint "{{downloads}}/ut2004-dmg" -nobrowse -readonly'
          - shell: bash
            run: 'mkdir -p "$HOME/Applications" "$HOME/Library/Application Support/UT2004"; app=$(find "{{downloads}}/ut2004-dmg" -maxdepth 2 -name "UT2004.app" -print -quit); cp -R "$app" "$HOME/Applications/"'
          - shell: bash
            run: 'for d in "{{downloads}}/ut2004-dmg"/*/; do case "$d" in */System/|*/UT2004.app/) ;; *) cp -R "$d" "$HOME/Library/Application Support/UT2004/" ;; esac; done'
          - shell: bash
            run: 'xattr -dr com.apple.quarantine "$HOME/Applications/UT2004.app" 2>/dev/null || true; hdiutil detach "{{downloads}}/ut2004-dmg"'
      verify:
          - type: dir_exists
            path: '~/Applications/UT2004.app'
    - id: register-link-handler
      title: 'Register the ut2004:// link handler (optional, Windows)'
      os: windows
      optional: true
      detail: |
          Optional. Lets the LANoMAT "Beitreten" button (Nativ) open UT2004 on a
          server through a `ut2004://address:port` link. A game folder copied by
          hand never registers this URL handler; the retail `Setup.exe` does. The
          step writes only to the current user (`HKCU\Software\Classes\ut2004`),
          needs no administrator rights and can be undone by deleting that key.

          Not tested against a real installation: whether UT2004 accepts the
          `ut2004://` address as its first argument is unverified. The Steam
          button works without this step on a Steam copy of the game.
      commands:
          - shell: powershell
            run: |
                $exe = ("{{target}}" -replace '/', '\') + '\System\UT2004.exe'
                $k = 'HKCU:\Software\Classes\ut2004'
                New-Item -Path "$k\shell\open\command" -Force | Out-Null
                Set-ItemProperty -Path $k -Name '(default)' -Value 'URL:UT2004 Protocol'
                Set-ItemProperty -Path $k -Name 'URL Protocol' -Value ''
                Set-ItemProperty -Path "$k\shell\open\command" -Name '(default)' -Value ('"' + $exe + '" "%1"')
      verify:
          - type: file_exists
            path: '{{target}}/System/UT2004.exe'
    - id: register-link-handler-linux
      title: 'Register the ut2004:// link handler (optional, Linux)'
      os: linux
      optional: true
      detail: |
          Optional. Registers `ut2004://` for the current user with a desktop
          entry and `xdg-mime`, so the LANoMAT "Beitreten" button (Nativ) can
          start `System/ut2004-bin-amd64` with the server address. Nothing outside
          `~/.local/share/applications` changes.

          Not tested against a real installation: whether UT2004 accepts the
          `ut2004://` address as its first argument is unverified.
      commands:
          - shell: bash
            run: 'mkdir -p ~/.local/share/applications'
          - shell: bash
            run: 'printf "[Desktop Entry]\nType=Application\nName=UT2004 (ut2004:// handler)\nExec=\"%s/System/ut2004-bin-amd64\" %%u\nPath=%s/System\nTerminal=false\nNoDisplay=true\nMimeType=x-scheme-handler/ut2004;\n" "{{target}}" "{{target}}" > ~/.local/share/applications/ut2004-handler.desktop'
          - shell: bash
            run: 'xdg-mime default ut2004-handler.desktop x-scheme-handler/ut2004'
          - shell: bash
            run: 'update-desktop-database ~/.local/share/applications'
      verify:
          - type: file_exists
            path: '{{target}}/System/ut2004-bin-amd64'
    - id: ut2004vr
      title: 'UT2004VR (optional, SteamVR, Windows)'
      os: windows
      optional: true
      detail: |
          Optional, only if the user chose VR. Verified against release v0.1.1:
          the zip unpacks into a `UT2004VR-0.1.1/` folder with `Install.bat`,
          `Installer/Install.ps1` and a `System/` payload (`UT2004VR.u`,
          `d3d9.dll`, `openvr_api.dll`, bindings, `Play-VR.bat`).

          The recipe calls `Installer/Install.ps1` directly with `-GameDir`,
          `-Unattended` and `-NoShortcut`; `Install.bat` is the interactive wrapper
          and ends in `pause`. The installer finds `{{target}}`, checks that
          `System\UT2004.exe` is x86-64 and `Build.ini` is `v3374` with a build
          date of 2026-07-18 or later, refuses to run while UT2004 or UCC runs, and
          copies the mod into `System`.

          `System\d3d9.dll` is the unsigned SteamVR bridge. If another tool
          (ReShade, dgVoodoo) already owns that name, the installer keeps it as
          `d3d9.dll.pre-UT2004VR` and the uninstaller puts it back; the tool is
          off while UT2004VR is installed. The prep command below moves such a
          foreign `d3d9.dll` aside first, because the unattended installer would
          otherwise stop at its "Continue?" prompt (default: no).

          Remove the mod with `System\UT2004VR-Uninstall.bat`. Start SteamVR first,
          then launch the `UT2004 VR` shortcut or `System\Play-VR.bat`; a normal
          UT2004 start stays flat.
      commands:
          - shell: powershell
            run: |
                $zip = (Get-ChildItem "{{downloads}}/UT2004VR-*.zip" | Sort-Object Name -Descending | Select-Object -First 1).FullName
                Expand-Archive -Path $zip -DestinationPath "{{downloads}}/UT2004VR" -Force
          - shell: powershell
            run: |
                $d3d9 = "{{target}}/System/d3d9.dll"
                if ((Test-Path $d3d9) -and -not ([Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($d3d9)).Contains('UT2004VR proxy'))) { Move-Item $d3d9 "$d3d9.pre-UT2004VR" -Force }
          - shell: powershell
            run: |
                $installer = (Get-ChildItem "{{downloads}}/UT2004VR" -Recurse -Filter Install.ps1 | Select-Object -First 1).FullName
                powershell -NoProfile -ExecutionPolicy Bypass -File $installer -GameDir "{{target}}" -Unattended -NoShortcut
      verify:
          - type: file_exists
            path: '{{target}}/System/UT2004VR-Uninstall.bat'
    - id: vrm2ut2004
      title: 'Build the VRM avatar bridge (optional, LAN server)'
      os: linux
      optional: true
      detail: |
          Only when the user picked avatars. The bridge is the private
          `jawa-solutions/vrm2ut2004` repository, so clone it on the LAN server
          (not on every client) with an account that can read it, and follow its
          README. `{{target}}` here is a scratch folder on the server, not a game
          install: only the generated UT2004 character packages travel to the
          clients' `System` folders.

          The installer has already matched the `.vrm` files on the LAN file host;
          feed those local paths to the tool. Do not invent a download URL for an
          avatar, and never block the base install or UT2004VR on an avatar.

          Live example: the operator's UT2004VR/VRM deployment at
          https://ut.raute1.org/ runs this path with converted VRM avatars. It
          answered HTTP/2 200 when checked on 2026-11-21; treat it as a
          reference, not as a download source.
      commands:
          - shell: bash
            run: 'git clone https://github.com/jawa-solutions/vrm2ut2004.git "{{target}}/Tools/vrm2ut2004"'
      verify:
          - type: dir_exists
            path: '{{target}}/Tools/vrm2ut2004'
    - id: check-install
      title: 'Check the install and start a bot match'
      os: any
      optional: false
      detail: |
          Start the game once and confirm the main menu reports the OldUnreal
          build. Then run a quick offline match: Instant Action → Deathmatch →
          DM-Rankin → 4 bots. This proves the renderer, audio and input work before
          the LAN night.

          Start flat with `System\UT2004.exe` on Windows, `System/UT2004` on
          Linux, or `UT2004.app` (in `~/Applications` or `{{target}}`) on macOS
          (see the launch targets). If the game asks for the DVD, the patch did
          not land in the folder that contains `System`. If the main menu still
          uses the old layout, the patch's `System` tree was merged with a retail
          `System`; recopy the patch over `{{target}}`.
      verify:
          - type: file_exists
            path: '{{target}}/System/Build.ini'
            os: windows
          - type: file_exists
            path: '{{target}}/System/Build.ini'
            os: linux
          - type: file_exists
            path: '{{target}}/System/UT2004.exe'
            os: windows
          - type: file_exists
            path: '{{target}}/System/D3D11Drv.dll'
            os: windows
          - type: file_exists
            path: '{{target}}/System/ut2004-bin-amd64'
            os: linux
          - type: command
            command: 'test -d "$HOME/Applications/UT2004.app" || test -d "{{target}}/UT2004.app"'
            os: macos
launch_targets:
    - id: flat-windows
      label: 'Flat on a monitor (Windows)'
      os: windows
      shell: powershell
      command: 'Start-Process -FilePath "{{target}}/System/UT2004.exe" -WorkingDirectory "{{target}}/System"'
      notes: 'Default. Starting UT2004 this way is always the flat game, even when UT2004VR is installed.'
    - id: flat-linux
      label: 'Flat on a monitor (Linux)'
      os: linux
      shell: bash
      command: '"{{target}}/System/ut2004-bin-amd64"'
      notes: 'Run it from {{target}}/System if the game cannot find its packages; there is no launcher script.'
    - id: flat-macos
      label: 'Flat on a monitor (macOS)'
      os: macos
      shell: bash
      command: 'open "$HOME/Applications/UT2004.app"'
      notes: 'Default on macOS. If the install left the app in the target instead, run `open "{{target}}/UT2004.app"`; the game data lives in ~/Library/Application Support/UT2004.'
    - id: vr-windows
      label: 'VR in a SteamVR headset (Windows)'
      os: windows
      shell: powershell
      command: 'Start-Process -FilePath "{{target}}/System/Play-VR.bat" -WorkingDirectory "{{target}}/System"'
      notes: 'Only with UT2004VR installed. Start SteamVR first; VR is on only from Play-VR.bat. Optional argument: a map name (for example DM-Antalus) to skip the menus.'
metadata:
    genre: arena-shooter
    players: '2-32'
    lan_recommended: true
    live_url: https://ut.raute1.org/
    tags: [fps, vr, classic, arena-shooter]
